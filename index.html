   매장 = room. 주소의 ?room= 이 없으면 누구나 오는 공개 매장(main)이에요.
   매장 정보(이름·점장·주간 목표)와 명부는 서버가 갖고, 각자 브라우저도 사본을 들고 있다가 서버가 잠에서 깨면 돌려줘요. */
const RM=window.CAFE_ROOM||'main',IN_STORE=RM!=='main';
const DEV_ID=(()=>{try{return localStorage.getItem('barista.device')||''}catch(e){return''}})();
const STORES_KEY='barista.stores',ROSTER_KEY='barista.roster.'+RM,PENDING_KEY='barista.pendingStore';
let STORES={};try{STORES=JSON.parse(localStorage.getItem(STORES_KEY)||'{}')||{}}catch(e){}
const saveStores=()=>{try{localStorage.setItem(STORES_KEY,JSON.stringify(STORES))}catch(e){}};
let META=IN_STORE&&STORES[RM]&&STORES[RM].meta||null;
let ROSTER={};try{const v=JSON.parse(localStorage.getItem(ROSTER_KEY)||'[]');if(Array.isArray(v))for(const e of v)if(e&&e.id)ROSTER[e.id]=e}catch(e){}
let SERVER_STORE=false,rosterSeeded=false;
if(IN_STORE){STORES[RM]=Object.assign(STORES[RM]||{},{last:Date.now()});saveStores()}

/* 이용 지표: 숫자만 서버에 세요(이름·내용은 안 보내요) */
const ev=e=>{try{if(ROOM&&ROOM.act)ROOM.act({a:'ev',e})}catch(_){}};
const myPid=()=>{try{return myPeerId()||DEV_ID}catch(e){return DEV_ID}};
const amOwner=()=>!!(META&&META.owner&&(META.owner===myPid()||META.owner===DEV_ID));
function isOwnerPeer(id){return !!(IN_STORE&&META&&META.owner&&id===META.owner)}
const inviteURL=()=>location.origin+location.pathname+'?room='+encodeURIComponent(RM);

/* ---------- 이번 주(월~일) 내 근무 기록 ---------- */
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekStart(){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekDates(){const s=weekStart();return[...Array(7)].map((_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d})}
function myWeek(){const ds=weekDates(),m=[],s=[];
  for(const d of ds){const v=DB.days[dkey(d)];m.push(v?v.focus||0:0);s.push(v&&((v.focus||0)>0||v.in)?1:0)}
  return{k:dkey(ds[0]),m,s}}
const todayIdx=()=>(new Date().getDay()+6)%7;
const hm=min=>{min=Math.round(min||0);const h=Math.floor(min/60),m=min%60;return h?(m?`${h}시간 ${m}분`:`${h}시간`):`${m}분`};
const hmShort=min=>{min=Math.round(min||0);const h=Math.floor(min/60),m=min%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`};

/* 공부를 처음 시작하는 순간 = 출근 도장 */
function clockIn(){
  const d=day();if(d.in)return;d.in=hhmm();save();
  const n=myWeek().s.reduce((a,b)=>a+b,0);
  toast(`출근 도장 쾅! ${d.in} 출근 · 이번 주 ${n}일째 출근이에요`);syncPresence();
}

/* ---------- 간판: 매장 이름, 버튼 ---------- */
function paintSign(){
  const h=$('cafeName'),sb=$('storeBtn'),hop=$('hopBtn');if(!h||!sb)return;
  if(IN_STORE){
    const t=(META&&META.title)||(STORES[RM]&&STORES[RM].title)||RM.replace(/-[a-z0-9]{4}$/,'');
    if(document.activeElement!==h)h.textContent=t;
    h.setAttribute('contenteditable',amOwner()?'true':'false');
    h.title=amOwner()?'점장만 매장 이름을 바꿀 수 있어요. 눌러서 바꾸기':(META&&META.ownerName?`점장 ${META.ownerName}님의 매장`:'우리 매장');
    sb.textContent='초대하기';sb.classList.remove('glow');
    hop.hidden=false;hop.textContent='공개 매장';hop.title='누구나 오는 공개 매장으로 가기 (박소금이 있는 곳)';hop.onclick=()=>{location.href=location.pathname};
    document.title=t+' · 오늘의 바리스타';
  }else{
    sb.textContent='우리 매장 열기';
    const last=Object.entries(STORES).filter(([k])=>k!=='main').sort((a,b)=>(b[1].last||0)-(a[1].last||0))[0];
    hop.hidden=!last;if(last){hop.textContent=last[1].title||'내 매장';hop.title=`"${last[1].title||last[0]}" 매장으로 출근하기`;hop.onclick=()=>{location.href='?room='+encodeURIComponent(last[0])}}
    let seen=false;try{seen=localStorage.getItem('barista.storeSeen')==='1'}catch(e){}
    sb.classList.toggle('glow',!seen&&!Object.keys(STORES).length);
  }
}
/* 간판 이름을 눌러서 바꿨을 때: 매장 안에서는 점장만 매장 이름을 바꿔요(true를 돌려주면 원래 처리는 건너뜀) */
function storeRename(el){
  if(!IN_STORE)return false;
  const t=el.textContent.replace(/\s+/g,' ').trim().slice(0,20);
  if(amOwner()&&t&&(!META||t!==META.title))setMeta({title:t});
  paintSign();return true;
}
function setMeta(patch){
  if(!IN_STORE)return;
  if(META&&amOwner()){Object.assign(META,patch);cacheMeta()}
  if(SERVER_STORE&&ROOM&&ROOM.act)ROOM.act(Object.assign({a:'meta'},patch));
  paintSign();
}
function cacheMeta(){if(!IN_STORE||!META)return;STORES[RM]=Object.assign(STORES[RM]||{},{title:META.title,meta:META,last:Date.now()});saveStores()}

/* ---------- 시트(팝업) ---------- */
const sheet=$('sheet');
function openSheet(title,sub,body){
  sheet.innerHTML=`<div class="sh-head"><h2 id="shTitle">${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}<button class="sh-x" aria-label="닫기">✕</button></div><div class="sh-body">${body}</div>`;
  sheet.querySelector('.sh-x').onclick=closeSheet;
  if(!sheet.open){try{sheet.showModal()}catch(e){sheet.setAttribute('open','')}}
  sheet.querySelector('.sh-body').scrollTop=0;
}
function closeSheet(){try{sheet.close()}catch(e){sheet.removeAttribute('open')}}
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});

const GOAL_OPTS=[5,10,15,20,30,0];
const goalChips=(cur)=>`<div class="goalchips" role="group" aria-label="이번 주 목표">${GOAL_OPTS.map(g=>`<button type="button" data-g="${g}" aria-pressed="${g===cur}">${g?g+'시간':'목표 없음'}</button>`).join('')}</div>`;
function bindGoalChips(root,onPick){root.querySelectorAll('.goalchips button').forEach(b=>b.onclick=()=>{root.querySelectorAll('.goalchips button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));onPick(+b.dataset.g)})}

function storeListHTML(){
  const list=Object.entries(STORES).filter(([k])=>k!=='main').sort((a,b)=>(b[1].last||0)-(a[1].last||0));
  if(!list.length)return'';
  return `<section class="sh-sec"><h3>내 매장</h3><ul class="storelist">${list.map(([k,v])=>`<li><a href="?room=${encodeURIComponent(k)}"${k===RM?' aria-current="page"':''}><span>${esc(v.title||k)}${v.meta&&(v.meta.owner===DEV_ID)?' <i class="aib own">점장</i>':''}</span><small>${k===RM?'지금 여기':'출근하기 →'}</small></a></li>`).join('')}${IN_STORE?`<li><a href="./"><span>공개 매장</span><small>누구나 오는 곳 →</small></a></li>`:''}</ul></section>`;
}

/* 우리 매장 열기 */
function openCreate(){
  try{localStorage.setItem('barista.storeSeen','1')}catch(e){}
  paintSign();
  let goal=10;
  openSheet('우리 매장 열기','친구들만 들어오는 우리 카페를 차려요',`
    <section class="sh-sec">
      <ul class="perks">
        <li><i>👑</i><span>내가 <b>점장</b>, 초대 링크로 들어온 친구는 <b>알바생</b>이에요</span></li>
        <li><i>☕</i><span>공부를 시작하면 <b>출근 도장</b>이 찍히고, 매장 <b>근무표</b>로 서로 이번 주 출근과 공부 시간을 봐요</span></li>
        <li><i>📸</i><span>공부 끝나면 <b>출근 인증 카드</b>를 단톡방에 바로 올릴 수 있어요. 인증샷 찍을 필요 없어요</span></li>
      </ul>
    </section>
    <section class="sh-sec">
      <label class="sh-field">매장 이름<input id="newName" maxlength="20" placeholder="예: 토익 900 스터디, 공채 준비반"></label>
    </section>
    <section class="sh-sec"><h3>이번 주 목표 (한 사람당)</h3>${goalChips(goal)}<p class="hint">점장이 나중에 언제든 바꿀 수 있어요.</p></section>
    <div class="sh-row"><button class="btn" id="newGo">매장 열기</button></div>
    ${storeListHTML()}`);
  bindGoalChips(sheet,g=>goal=g);
  const inp=$('newName');setTimeout(()=>inp.focus(),60);
  const go=()=>{
    const title=inp.value.replace(/\s+/g,' ').trim().slice(0,20);
    if(!title){inp.focus();toast('매장 이름을 먼저 정해요');return}
    const slug=title.replace(/[^\w가-힣]/g,'').slice(0,14)||'cafe';
    const room=slug+'-'+Math.random().toString(36).slice(2,6);
    try{localStorage.setItem(PENDING_KEY,JSON.stringify({room,title,goal,at:Date.now()}))}catch(e){}
    STORES[room]={title,last:Date.now(),meta:{title,owner:DEV_ID,ownerName:nick,goal,at:Date.now()}};saveStores();
    try{saveStudy()}catch(e){}
    ev('create');setTimeout(()=>{location.href='?room='+encodeURIComponent(room)},120);
  };
  $('newGo').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go()}});
}

/* 초대하기 (매장 안) */
function inviteText(){const t=(META&&META.title)||'우리 매장';return `☕ [오늘의 바리스타] ${t}에 알바생으로 와 줘!\n커피 한 잔 직접 만들어 들고 같이 출근해서 공부하자.`}
function openInvite(){
  const own=amOwner(),n=Object.keys(rosterEntries()).length;
  const sub=META?(META.ownerName?`점장 ${META.ownerName}`:'우리 매장')+` · 알바생 ${n}명`+(META.goal?` · 주 ${META.goal}시간 목표`:''):'매장 정보를 불러오는 중…';
  openSheet((META&&META.title)||'우리 매장',sub,`
    <section class="sh-sec"><h3>알바생 초대하기</h3>
      <div class="invite"><div class="msg">${esc(inviteText())}</div><div class="url">${esc((()=>{try{return decodeURI(inviteURL())}catch(e){return inviteURL()}})())}</div></div>
      <div class="sh-row" style="margin-top:10px"><button class="btn" id="invShare">초대 링크 보내기</button><button class="btn ghost" id="invCopy">링크 복사</button></div>
      <p class="hint">단톡방에 붙이면 "○○에 알바생으로 초대됐어요" 미리보기가 떠요. 링크를 아는 사람만 들어올 수 있어요.</p>
    </section>
    ${own?`<section class="sh-sec"><h3>점장 설정</h3>
      <label class="sh-field">매장 이름<input id="metaName" maxlength="20" value="${esc((META&&META.title)||'')}"></label>
      <div style="margin-top:12px"><div class="sh-field" style="margin-bottom:6px">이번 주 목표 (한 사람당)</div>${goalChips(META?META.goal:10)}</div>
    </section>`:''}
    ${own?memberHTML():''}
    ${storeListHTML()}
    <div class="sh-row"><button class="btn ghost" id="invNew">＋ 새 매장 열기</button></div>`);
  if(own)bindMember();
  const copy=async()=>{ev('invite');const txt=inviteText()+'\n'+inviteURL();
    try{await navigator.clipboard.writeText(txt);toast('초대 메시지를 복사했어요. 단톡방에 붙여 넣어요!')}
    catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('초대 메시지를 복사했어요')}catch(_){toast('복사가 막혀 있어요. 주소창 링크를 직접 보내 주세요')}ta.remove()}};
  $('invCopy').onclick=copy;
  $('invShare').onclick=async()=>{
    if(navigator.share){try{await navigator.share({title:(META&&META.title)||'오늘의 바리스타',text:inviteText(),url:inviteURL()});ev('invite');return}catch(e){if(e&&e.name==='AbortError')return}}
    copy();
  };
  $('invNew').onclick=openCreate;
  if(own){
    const mn=$('metaName');
    mn.addEventListener('change',()=>{const t=mn.value.replace(/\s+/g,' ').trim().slice(0,20);if(t)setMeta({title:t})});
    bindGoalChips(sheet,g=>{setMeta({goal:g});toast(g?`이번 주 목표를 ${g}시간으로 정했어요`:'주간 목표를 없앴어요')});
  }
}
/* ---------- 점장 멤버십 (준비 중): 진짜로 돈 낼 사람이 있는지 먼저 물어봐요 ---------- */
const MEMBER_KEY='barista.member';
let MEMBER={};try{MEMBER=JSON.parse(localStorage.getItem(MEMBER_KEY)||'{}')||{}}catch(e){}
const saveMember=()=>{try{localStorage.setItem(MEMBER_KEY,JSON.stringify(MEMBER))}catch(e){}};
const PRICES=[[1900,'월 1,900원'],[2900,'월 2,900원'],[4900,'월 4,900원'],[0,'무료면 쓸래요']];
function memberHTML(){
  return `<section class="sh-sec member"><div class="mb-tag">준비 중</div><h3>점장 멤버십</h3>
    <ul class="perks">
      <li><i>📅</i><span><b>지난 근무표 보관</b> · 지금은 이번 주만 보여요. 월간 출석률과 누적 시간까지</span></li>
      <li><i>🎨</i><span><b>매장 꾸미기</b> · 인테리어 테마, 간판 색, 칠판 메뉴를 우리 매장답게</span></li>
      <li><i>👥</i><span><b>알바생 정원 늘리기</b> · 지금 12석에서 24석으로</span></li>
      <li><i>💸</i><span><b>목표 미달 표시</b> · 주간 목표 못 채운 사람 자동 정리 (벌금 계산은 점장님 몫)</span></li>
    </ul>
    <div id="mbBox">${memberBox()}</div></section>`;
}
function memberBox(){
  if(MEMBER.price!=null)return `<p class="mb-done">고마워요! "${PRICES.find(p=>p[0]===MEMBER.price)[1]}"로 기록했어요. 생기면 이 매장 간판에서 제일 먼저 알려 드릴게요.</p>`;
  if(MEMBER.want)return `<p class="mb-q">얼마면 쓸 것 같아요? (매장 하나, 점장 1명만 내요)</p><div class="goalchips mb-price">${PRICES.map(p=>`<button type="button" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>`;
  return `<div class="sh-row"><button class="btn gold" id="mbWant">이거 생기면 쓸래요</button></div><p class="hint" style="margin:0">아직 결제는 없어요. 눌러 주면 만들지 말지 정하는 데 써요.</p>`;
}
function bindMember(){
  if(!MEMBER.viewed){MEMBER.viewed=1;saveMember();ev('member_view')}
  const box=$('mbBox');if(!box)return;
  const w=$('mbWant');if(w)w.onclick=()=>{MEMBER.want=1;saveMember();ev('member_want');box.innerHTML=memberBox();bindMember()};
  box.querySelectorAll('.mb-price button').forEach(b=>b.onclick=()=>{MEMBER.price=+b.dataset.p;saveMember();ev('price_'+b.dataset.p);box.innerHTML=memberBox()});
}
$('storeBtn').onclick=()=>IN_STORE?openInvite():openCreate();

/* ---------- 이번 주 근무표 ---------- */
function rosterEntries(){
  const out={},wkKey=dkey(weekStart());
  for(const e of Object.values(ROSTER))out[e.id]=Object.assign({},e);
  try{for(const p of (typeof PEOPLE!=='undefined'?PEOPLE:[])){if(p.isNpc||p.isStaff||!p.peer)continue;
    const o=out[p.peer]||{id:p.peer};o.name=p.name;if(p.pr&&p.pr.look)o.look=p.pr.look;if(p.pr&&p.pr.wk)o.wk=p.pr.wk;o.live=true;out[p.peer]=o}}catch(e){}
  const me=myPid();if(me){const o=out[me]||{id:me};o.name=nick||'나';o.look=lookOut();o.wk=myWeek();o.me=true;out[me]=o}
  for(const o of Object.values(out)){if(!o.wk||o.wk.k!==wkKey)o.wk={k:wkKey,m:[0,0,0,0,0,0,0],s:[0,0,0,0,0,0,0]}}
  if(!IN_STORE)for(const k in out)if(!out[k].me)delete out[k];
  return out;
}
const DAYN=['월','화','수','목','금','토','일'];
function openRoster(){
  ev('roster');
  const ds=weekDates(),ti=todayIdx(),goal=IN_STORE&&META?META.goal||0:0;
  const list=Object.values(rosterEntries()).map(e=>Object.assign(e,{tot:e.wk.m.reduce((a,b)=>a+b,0),days:e.wk.s.reduce((a,b)=>a+b,0)}))
    .sort((a,b)=>(b.tot-a.tot)||(b.days-a.days)||((a.name||'')<(b.name||'')?-1:1));
  const range=`${ds[0].getMonth()+1}.${ds[0].getDate()}(월) – ${ds[6].getMonth()+1}.${ds[6].getDate()}(일)`;
  const rows=list.map(e=>{
    const pct=goal?Math.min(100,e.tot/(goal*60)*100):Math.min(100,e.tot/(20*60)*100);
    return `<div class="wk-row${e.me?' me':''}"><div class="av">${e.look?personSVG(e.look,{face:'smile'}):''}</div>
      <div class="nm">${esc(e.name||'알바생')}${isOwnerPeer(e.id)?' <i class="aib own">점장</i>':''}</div>
      <div class="tot"><b>${hmShort(e.tot)}</b>${goal?` / ${goal}h`:''}</div>
      <div class="wk-days">${DAYN.map((n,i)=>`<div class="wk-d${e.wk.s[i]?' on':''}${i===ti?' today':''}${i>ti?' future':''}" title="${n}요일 ${e.wk.s[i]?hm(e.wk.m[i])+' 근무':'출근 기록 없음'}"><span class="st">☕</span>${n}</div>`).join('')}</div>
      <div class="wk-bar${goal&&e.tot>=goal*60?' full':''}"><i style="width:${pct.toFixed(1)}%"></i></div></div>`}).join('');
  const sub=IN_STORE?`${range} · ${goal?`목표 한 사람당 ${goal}시간`:'주간 목표 없음'}`:`${range} · 내 기록`;
  openSheet(IN_STORE?'이번 주 근무표':'내 근무표',sub,`
    <div class="wk-tbl">${rows}</div>
    ${IN_STORE?(list.length<2?'<p class="wk-empty">아직 알바생이 나뿐이에요. "초대하기"로 친구를 부르면 여기서 서로의 출근 도장을 볼 수 있어요.</p>':''):'<p class="wk-empty">공개 매장에서는 내 기록만 보여요. "우리 매장 열기"로 친구들만 오는 매장을 만들면 서로의 근무표를 같이 봐요.</p>'}
    <p class="hint" style="margin:0">공부를 시작한 날엔 ☕ 출근 도장이 찍혀요. 시간은 다 마신 잔과 멈춘 시점까지 센 공부 시간이에요.</p>
    <div class="sh-row"><button class="btn" id="wkCard">내 출근 인증 카드 만들기</button>${IN_STORE?'<button class="btn ghost" id="wkInv">알바생 초대하기</button>':'<button class="btn ghost" id="wkNew">우리 매장 열기</button>'}</div>`);
  $('wkCard').onclick=openCard;
  if($('wkInv'))$('wkInv').onclick=openInvite;
  if($('wkNew'))$('wkNew').onclick=openCreate;
}
$('rosterBtn').onclick=openRoster;

/* ---------- 출근 인증 카드 (단톡방 인증용 이미지) ---------- */
const CSSV={'--cupline':'#56675E','--glass':'rgba(255,255,255,.6)','--accent':'#2C6A57','--line':'#C9D5CB','--muted':'#5F6B62','--body':'sans-serif','--ink':'#25201C'};
const svgImg=(svg,w,h)=>new Promise((ok,no)=>{
  svg=svg.replace(/var\((--[\w-]+)\)/g,(m,k)=>CSSV[k]||'#56675E').replace(/^<svg/,`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"`);
  const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function makeCard(){
  try{await Promise.all([document.fonts.load('60px Jua'),document.fonts.load('30px "Gowun Dodum"'),document.fonts.load('600 26px "IBM Plex Mono"')])}catch(e){}
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const F=(px,f)=>`${px}px ${f==='m'?'"IBM Plex Mono",monospace':f==='b'?'"Gowun Dodum",sans-serif':'Jua,"Gowun Dodum",sans-serif'}`;
  const d=day(),wk=myWeek(),ti=todayIdx(),now=new Date();
  const store=IN_STORE?((META&&META.title)||'우리 매장'):(DB.name||'나의 작은 카페');
  const goal=IN_STORE&&META?META.goal||0:0,wtot=wk.m.reduce((a,b)=>a+b,0),wdays=wk.s.reduce((a,b)=>a+b,0);
  // 바닥: 크림 + 타일 무늬
  c.fillStyle='#FFF8EC';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(47,93,76,.06)';c.lineWidth=3;for(let y=300;y<H;y+=44){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  // 차양
  for(let i=0;i<12;i++){c.fillStyle=i%2?'#FFF8EC':'#2F5D4C';c.fillRect(i*90,0,90,70);c.beginPath();c.arc(i*90+45,70,45,0,Math.PI);c.fill()}
  // 나무 간판
  const g=c.createLinearGradient(0,130,0,290);g.addColorStop(0,'#9A6740');g.addColorStop(1,'#6E4528');
  c.fillStyle=g;rr(c,50,140,W-100,150,26);c.fill();
  c.strokeStyle='#FFE7A8';c.lineWidth=3;rr(c,90,186,124,52,26);c.stroke();
  c.fillStyle='#FFE7A8';c.font=F(26,'m');c.textAlign='center';c.textBaseline='middle';c.fillText('OPEN',152,213);
  c.fillStyle='#FFF4E2';c.textAlign='left';let fs=62;c.font=F(fs);while(c.measureText(store).width>W-340&&fs>34){fs-=2;c.font=F(fs)}c.fillText(store,240,216);
  // 출근 도장
  c.save();c.translate(W-190,420);c.rotate(-.2);c.strokeStyle='#C2577A';c.fillStyle='#C2577A';
  c.lineWidth=7;c.beginPath();c.arc(0,0,112,0,Math.PI*2);c.stroke();c.lineWidth=3;c.beginPath();c.arc(0,0,96,0,Math.PI*2);c.stroke();
  c.textAlign='center';c.font=F(58);c.fillText(d.in||d.focus?'출근':'휴무',0,-6);c.font=F(30,'m');c.fillText(`${now.getMonth()+1}.${String(now.getDate()).padStart(2,'0')}`,0,48);
  c.font=F(22,'b');c.fillText(d.in?d.in+' 출근':'',0,-62);c.restore();
  // 캐릭터와 오늘의 잔
  try{const me=await svgImg(personSVG(lookOut(),{face:'happy'}),26*15,37*15);c.imageSmoothingEnabled=false;c.drawImage(me,90,330,26*15,37*15)}catch(e){}
  const last=[...d.cups].reverse().find(x=>!x.guest),lr=last&&R.find(r=>r.n===last.n);
  if(lr){try{const i=ideal(lr),cu=await svgImg(cupSVG(i.kind,i.L,{ice:i.ice,straw:lr.ice,steam:i.kind==='mug'}),200,250);c.imageSmoothingEnabled=true;c.drawImage(cu,440,640,200,250)}catch(e){}}
  // 이름과 오늘 기록
  c.textAlign='left';c.fillStyle='#2F5D4C';c.font=F(30,'b');c.fillText(IN_STORE?(amOwner()?'점장':'알바생'):'바리스타',680,640);
  c.fillStyle='#25201C';fs=64;c.font=F(fs);const nm=nick||'나';while(c.measureText(nm).width>W-740&&fs>36){fs-=2;c.font=F(fs)}c.fillText(nm,680,700);
  c.fillStyle='#5F6B62';c.font=F(30,'b');c.fillText('오늘 근무',680,790);
  c.fillStyle='#2F7A5A';fs=76;c.font=F(fs);const tt=hm(d.focus);while(c.measureText(tt).width>W-740&&fs>44){fs-=2;c.font=F(fs)}c.fillText(tt,680,860);
  const mine=d.cups.filter(x=>!x.guest),line=mine.length?`${mine[mine.length-1].n}${mine.length>1?` 외 ${mine.length-1}잔`:''}`:'아직 첫 잔 전';
  c.fillStyle='#5F6B62';c.font=F(28,'b');c.fillText(line,680,912);
  // 이번 주 출근 도장
  c.fillStyle='#FFFFFF';rr(c,60,960,W-120,300,28);c.fill();c.strokeStyle='#E8DCC6';c.lineWidth=3;c.stroke();
  c.fillStyle='#25201C';c.font=F(36);c.textAlign='left';c.fillText('이번 주 출근 도장',100,1015);
  c.textAlign='right';c.fillStyle='#2F5D4C';c.font=F(30,'m');c.fillText(`${wdays}/7일 · ${hmShort(wtot)}${goal?` / ${goal}h`:''}`,W-100,1015);
  for(let i=0;i<7;i++){const cx=130+i*137,cy=1105,on=wk.s[i];
    c.lineWidth=4;c.setLineDash(on?[]:[10,8]);c.strokeStyle=on?'#2F7A5A':'#CFC3AE';c.fillStyle='#2F7A5A';
    c.beginPath();c.arc(cx,cy,46,0,Math.PI*2);if(on)c.fill();c.stroke();c.setLineDash([]);
    if(i===ti){c.strokeStyle='#F2C46B';c.lineWidth=5;c.beginPath();c.arc(cx,cy,56,0,Math.PI*2);c.stroke()}
    c.textAlign='center';if(on){c.fillStyle='#FFFFFF';c.font=F(38);c.fillText('☕',cx,cy+2)}
    c.fillStyle=i>ti?'#B9AE9C':'#5F6B62';c.font=F(26,'b');c.fillText(DAYN[i],cx,cy+80)}
  if(goal){const p=Math.min(1,wtot/(goal*60));c.fillStyle='#F0E8DA';rr(c,100,1222,W-200,14,7);c.fill();if(p>0){c.fillStyle=p>=1?'#E0A93B':'#2F7A5A';rr(c,100,1222,Math.max(14,(W-200)*p),14,7);c.fill()}}
  // 바닥글
  c.textAlign='center';c.fillStyle='#8A7A66';c.font=F(26,'b');c.fillText('오늘의 바리스타 · 내가 만든 커피 한 잔 들고 같이 공부해요',W/2,1300);
  return cv;
}
async function openCard(){
  ev('card');
  openSheet('출근 인증 카드','단톡방에 올리면 인증 끝! 사진 찍을 필요 없어요','<div class="cardwait">카드 굽는 중…</div>');
  let cv;try{cv=await makeCard()}catch(e){console.error(e);sheet.querySelector('.sh-body').innerHTML='<p class="wk-empty">카드를 만들지 못했어요. 잠시 뒤에 다시 해 볼까요?</p>';return}
  const blob=await new Promise(ok=>cv.toBlob(ok,'image/png')),url=URL.createObjectURL(blob);
  const n=new Date(),fname=`출근인증-${n.getMonth()+1}${String(n.getDate()).padStart(2,'0')}.png`,file=new File([blob],fname,{type:'image/png'});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  sheet.querySelector('.sh-body').innerHTML=`<img class="cardprev" src="${url}" alt="오늘 출근 인증 카드">
    <div class="sh-row">${canShare?'<button class="btn" id="cdShare">카드 보내기</button>':''}<a class="btn${canShare?' ghost':''}" id="cdSave" href="${url}" download="${fname}" style="text-align:center;text-decoration:none">이미지 저장</a></div>
    ${canShare?'':'<p class="hint" style="margin:0">저장한 이미지를 단톡방에 올리면 돼요.</p>'}`;
  if(canShare)$('cdShare').onclick=async()=>{try{await navigator.share({files:[file],title:'출근 인증',text:IN_STORE?inviteText()+'\n'+inviteURL():'오늘의 바리스타 출근 인증 ☕'})}catch(e){}};
}

/* ---------- 서버와 맞추기 ---------- */
function applyStore(m){
  if(!IN_STORE)return;
  SERVER_STORE=true;
  if(m.t==='meta'){
    if(m.meta){
      const mine=STORES[RM]&&STORES[RM].meta;
      if(m.meta.guess&&mine&&!mine.guess&&mine.owner!==m.meta.owner){ROOM.act({a:'metaseed',meta:mine});return}
      META=m.meta;cacheMeta();try{localStorage.removeItem(PENDING_KEY)}catch(e){}}
    else{
      // 서버가 이 매장을 모르면: 방금 연 매장이면 만들고, 아니면 내가 기억하는 매장 정보를 돌려줘요
      let pend=null;try{pend=JSON.parse(localStorage.getItem(PENDING_KEY)||'null')}catch(e){}
      if(pend&&pend.room===RM)ROOM.act({a:'meta',title:pend.title,goal:pend.goal});
      else if(STORES[RM]&&STORES[RM].meta)ROOM.act({a:'metaseed',meta:STORES[RM].meta});
      else ROOM.act({a:'meta',guess:1,title:RM.replace(/-[a-z0-9]{4}$/,'').slice(0,20)||'우리 매장',goal:10}); // 주소만 아는 매장: 처음 온 사람이 (임시) 점장
    }
    paintSign();lastSig='';renderFriends();try{autoBrewLabel()}catch(e){}
  }else if(m.t==='roster'){
    const srv={};for(const e of m.list||[])if(e&&e.id)srv[e.id]=e;
    if(!rosterSeeded){rosterSeeded=true;
      const missing=Object.values(ROSTER).filter(e=>e.seen&&(!srv[e.id]||srv[e.id].seen<e.seen));
      if(missing.length)ROOM.act({a:'rosterseed',list:missing.slice(0,60)})}
    for(const id in srv)if(!ROSTER[id]||(ROSTER[id].seen||0)<=srv[id].seen)ROSTER[id]=srv[id];
    try{localStorage.setItem(ROSTER_KEY,JSON.stringify(Object.values(ROSTER).slice(-60)))}catch(e){}
  }
}
(async()=>{try{const r=await window.claude.use('room');if(r&&r.onStore)r.onStore(applyStore)}catch(e){}})();
paintSign();
// 이름을 바꾸면 점장 이름도 같이 맞춰요
$('nick').addEventListener('change',()=>{setTimeout(()=>{if(IN_STORE&&amOwner()&&META&&META.ownerName!==nick)setMeta({})},300)});
</script>

<script>
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* 새 버전이 배포되면 알아서 새로고침해요. 음료 만드는 중이거나 채팅을 치는 중이면 끝날 때까지 기다려요(타이머는 localStorage로 이어져요). */
(function(){
  if(!location.protocol.startsWith('http'))return;
  let base=null,pending=false;
  const ver=()=>fetch('sw.js?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/VERSION\s*=\s*'([^']+)'/);return m?m[1]:null}).catch(()=>null);
  const busy=()=>{try{if(CUR==='scrBar')return true}catch(e){}const a=document.activeElement;return !!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.value)};
  const tryReload=()=>{if(!pending)return;if(busy())return;if(document.getElementById('cafe-retired'))return;try{if(typeof saveStudy==='function')saveStudy()}catch(e){}location.reload()};
  const check=()=>ver().then(v=>{if(!v)return;if(base===null){base=v;return}if(v!==base){pending=true;tryReload()}});
  check();
  setInterval(()=>{pending?tryReload():check()},90*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pending?tryReload():check()});
  setInterval(tryReload,3000);
})();
</script>
