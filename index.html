<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 바리스타</title>
<meta name="description" content="직접 만든 음료를 들고 카페 알바 동료들과 같이 공부하는 집중 타이머">
<meta name="theme-color" content="#2F5D4C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* ===== people vs AI, closeness, ask-myself ===== */
.bub.hb.st{background:#EAF5EE;border-color:#9CCBB3;color:#1F3A2E}
.bub.hb.st::after{border-top-color:#EAF5EE}
.bub.hb.ai{background:#FFFFFF;border-color:#D8D3CB;color:#3A332C;font-weight:500}
.bub.hb.ai::after{border-top-color:#FFFFFF}
.bub.hb.say{background:#2F7A5A;border-color:#2F7A5A;color:#FFFFFF}
.bub.hb.say::after{border-top-color:#2F7A5A}
.hname.human{background:#2F5D4C;color:#FFFFFF;opacity:1}
.hname.human.me{background:var(--mine,#C2577A);color:#FFFFFF}
.hname.human.me .dot{background:#FFD6E2}
.hname.npc{background:rgba(255,255,255,.82);color:#6D6255;font-weight:500;opacity:1}
.hname .dot,.legend .dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#7BE0A6;margin-right:.35em;vertical-align:.02em;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.aib{font-style:normal;font-size:.72em;font-weight:800;background:#E6E1D9;color:#6D6255;border-radius:4px;padding:0 .3em;margin-right:.35em;letter-spacing:.05em}
.fh{font-style:normal;color:#FF9BB0;margin-left:.3em;letter-spacing:-.05em}
.legend{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:10px;display:inline-flex;align-items:center;gap:3px;font-family:var(--body)}
.legend .dot{box-shadow:0 0 0 1.5px var(--line)}
.legend .aib{margin-left:8px}
.aitag{font-size:11px;font-weight:700;background:#E6E1D9;color:#6D6255;border-radius:6px;padding:1px 7px}
.flv{font-size:12.5px;color:#C2566C;font-weight:600}
.hsit.npcseat{display:none;background:rgba(47,93,76,.9);border:1.5px solid #fff;color:#fff}
.hall.pick .hsit.npcseat{display:block}
#quietBtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bhbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.btn.ask{background:#FFF3DF;color:#5A3A1C;box-shadow:0 3px 0 #C99A5B;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;padding:8px 14px}
.btn.ask small{font-family:var(--body);font-size:11px;opacity:.75;margin-top:2px}
.btn.ask:disabled{opacity:.6;cursor:progress}
@media (min-width:820px){#scrMenu .bhbtns .btn{font-size:13.5px;padding:7px 11px}}

.hname.human .ftime{color:#D9F7E6;font-weight:800;opacity:1}
.hname.human.me .ftime{color:#FFFFFF}
.chatlog{flex-basis:100%;display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.chatlog .ln{display:flex;gap:8px;align-items:baseline}
.chatlog .ln time{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.chatlog .ln span{background:#2F7A5A;color:#fff;border-radius:9px;padding:1px 8px;word-break:break-all}
.chatlog .empty{color:var(--muted)}

.chatpanel{position:absolute;right:12px;top:10px;z-index:7;width:min(340px,calc(100% - 24px));max-height:min(420px,calc(100% - 80px));display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(40,30,20,.22);overflow:hidden}
.cp-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.cp-list{overflow:auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.cp-ln{display:grid;grid-template-columns:auto auto 1fr;gap:6px;align-items:baseline}
.cp-ln time{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cp-ln b{font-size:12px;color:var(--accent);white-space:nowrap}
.cp-ln span{background:#2F7A5A;color:#fff;border-radius:9px;padding:1px 8px;justify-self:start;word-break:break-all}
.cp-ln.mine b{color:var(--mine,#C2577A)}
.cp-ln.mine span{background:var(--mine,#C2577A)}
#chatBtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
</style>
<script src="config.js"></script>
<script src="realtime.js"></script>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a café shift — menu board → bar station → seat. Sage tile walls, apron green, crema amber. */
:root{
  --bg:#E6EDE7; --tile:#DCE5DD; --surface:#FAFBF7; --surface-2:#F0F4EF;
  --ink:#25201C; --muted:#5F6B62; --line:#C9D5CB;
  --accent:#2C6A57; --accent-ink:#FFFFFF; --accent-soft:#D5E7DF;
  --crema:#B5722A; --board:#22332C; --board-ink:#EEF1E6; --board-muted:#A9BBB0;
  --glass:rgba(255,255,255,.6); --cupline:#56675E;
  --floor1:#E4D6C3; --floor2:#DDCDB8; --table:#A9784F; --table-edge:#7E5636; --chair:#5E6B62;
  --good:#2A8556; --warn:#B9771B; --bad:#B5463A;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --floor1:#2A241E; --floor2:#25201B; --table:#6E4E35; --table-edge:#4A3423; --chair:#8C9A91;
  --bg:#131917; --tile:#18201C; --surface:#1D2622; --surface-2:#232E29;
  --ink:#ECE8DF; --muted:#9DA99F; --line:#33413A;
  --accent:#78C3A7; --accent-ink:#0D1A14; --accent-soft:#24392F;
  --crema:#E1A55B; --board:#0E1613; --board-ink:#E6EADF; --board-muted:#8FA397;
  --glass:rgba(255,255,255,.07); --cupline:#AFC0B6;
  --good:#5FC48D; --warn:#E3A84A; --bad:#E57C6F; color-scheme:dark}}
:root[data-theme="dark"]{
  --floor1:#2A241E; --floor2:#25201B; --table:#6E4E35; --table-edge:#4A3423; --chair:#8C9A91;
  --bg:#131917; --tile:#18201C; --surface:#1D2622; --surface-2:#232E29;
  --ink:#ECE8DF; --muted:#9DA99F; --line:#33413A;
  --accent:#78C3A7; --accent-ink:#0D1A14; --accent-soft:#24392F;
  --crema:#E1A55B; --board:#0E1613; --board-ink:#E6EADF; --board-muted:#8FA397;
  --glass:rgba(255,255,255,.07); --cupline:#AFC0B6;
  --good:#5FC48D; --warn:#E3A84A; --bad:#E57C6F; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--tile) 2px,transparent 2px),linear-gradient(90deg,var(--tile) 2px,transparent 2px);
  background-size:44px 22px;}
.app{max-width:1080px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--crema);outline-offset:2px}

/* sign */
.sign{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.sign-left{display:flex;align-items:center;gap:10px;min-width:0}
.open{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);border:1.5px solid var(--accent);
  border-radius:99px;padding:2px 8px;display:flex;align-items:center;gap:6px}
.open::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.2;outline:none;border-bottom:1.5px dashed transparent;min-width:2ch}
h1:hover,h1:focus{border-bottom-color:var(--line)}
.ledger{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ledger b{font-family:var(--mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* menu board */
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:20px 18px 18px;
  box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--board) 70%,#6b4a2f), 0 6px 18px rgba(0,0,0,.12)}
.board-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px;padding-inline:6px}
.board h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em}
.board p{margin:2px 0 0;color:var(--board-muted);font-size:14px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:10px 10px 12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;color:var(--board-ink);transition:transform .15s,background .15s}
.mcard:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.mcard svg{width:84px;height:104px}
.mcard .nm{font-family:var(--display);font-size:17px;line-height:1.25}
.mcard .pr{font-family:var(--mono);font-size:12px;color:var(--board-muted)}
.tag{font-size:11px;border-radius:99px;padding:0 7px;margin-top:4px}
.tag.ice{background:#cfe9f2;color:#1d4a5a}.tag.hot{background:#f4d6c4;color:#6a2d14}
.btn{border:none;border-radius:12px;padding:11px 18px;font-family:var(--display);font-size:17px;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.crema{background:var(--crema);color:#1b120a;box-shadow:0 3px 0 color-mix(in srgb,var(--crema) 60%,#000)}
.board .btn.crema{white-space:nowrap}

/* ledger list */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 8px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.row:first-child{border-top:none}
.row .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .r{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stars{color:var(--crema);letter-spacing:1px}
.empty{color:var(--muted);font-size:14px;margin:0}

/* bar */
.bar{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:6px 6px 14px 14px;padding:14px 14px 16px;position:relative;
  box-shadow:0 2px 0 var(--line)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;
  background:radial-gradient(circle at 6px 6px,transparent 4px,var(--surface) 4.5px) 0 0/12px 6px}
.tno{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between}
.who{margin:8px 0 2px;font-size:13px;color:var(--muted)}
.say{margin:0 0 6px;font-size:14px}
.tname{font-family:var(--display);font-size:24px;line-height:1.2;margin:2px 0 10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:s}
.steps li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:14px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted)}
.steps li.now{background:var(--accent-soft);font-weight:700}
.steps li.now::before{border-color:var(--accent);color:var(--accent)}
.steps li.done{color:var(--muted)}
.steps li.done::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots{font-size:11px;color:var(--crema);letter-spacing:1px}
.ticket .back{margin-top:12px;width:100%;font-size:14px;padding:8px}

.counter{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;min-height:270px}
.cupwrap{display:grid;place-items:center}
.cupwrap svg{width:190px;height:236px;overflow:visible}
.cupwrap.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.say-box{display:flex;flex-direction:column;gap:10px;min-width:0}
.hint{font-family:var(--display);font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:14px}
.fb{font-size:15px;min-height:1.6em;margin:0;font-weight:700}
.fb.good{color:var(--good)}.fb.warn{color:var(--warn)}.fb.bad{color:var(--bad)}
.readout{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.readout small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.meter{position:relative;height:16px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 30%,transparent);border-inline:2px solid var(--good)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#9fc3d9,#e8a46b,#d2553f);opacity:.85}
.meter-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}

.station{background:color-mix(in srgb,var(--ink) 88%,var(--bg));border-radius:14px;padding:12px;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ing{border:none;border-radius:10px;background:var(--surface);padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:13px;line-height:1.2;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;
  box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .06s}
.ing .sw{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18)}
.ing .sw.cup{border-radius:3px 3px 8px 8px;background:transparent;border:2px solid var(--cupline)}
.ing.on{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.25);background:var(--accent-soft)}
.ing.hintme{outline:3px solid var(--crema);outline-offset:-3px}
.ing.no{animation:shake .3s}

/* done + study */
.done{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:center}
.receipt{font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;gap:4px;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);padding:10px 0;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.receipt div{display:flex;justify-content:space-between;gap:10px}
.bigstars{font-size:34px;color:var(--crema);letter-spacing:4px;line-height:1}
.acts{display:flex;flex-wrap:wrap;gap:10px}

.study{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
.seat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden}
.seat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--crema) 35%,var(--surface)) 0 60px,color-mix(in srgb,var(--crema) 28%,var(--surface)) 60px 120px);border-top:3px solid color-mix(in srgb,var(--crema) 55%,var(--surface))}
.seat svg{width:220px;height:272px;position:relative;z-index:1;overflow:visible}
.seat .lbl{font-family:var(--display);font-size:20px;position:relative;z-index:1}
.seat .sip{font-size:13px;color:var(--muted);position:relative;z-index:1;margin-bottom:46px}
.timerbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.clock{font-family:var(--mono);font-weight:600;font-size:clamp(56px,13vw,96px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 14px;font-family:var(--mono);font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:default}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--crema);width:0}
.finish{background:var(--accent-soft);border-radius:12px;padding:14px}
.finish h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 4px}
.finish p{margin:0 0 10px}

.steam path{fill:none;stroke:var(--cupline);stroke-width:2.5;stroke-linecap:round;opacity:0;animation:steam 3s infinite}
.steam path:nth-child(2){animation-delay:1s}.steam path:nth-child(3){animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.55}100%{opacity:0;transform:translateY(-16px)}}

/* friends */
.friends{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.fhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.fhead h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0;display:flex;align-items:center;gap:8px}
.fcount{font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 9px}
.nick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.nick input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;width:9.5em}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:40px 22px;padding:52px 18px 18px;border-radius:12px;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,var(--floor1) 0 40px,var(--floor2) 40px 80px)}
.tbl{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:end;gap:4px}
.ttop{height:46px;background:var(--table);border-radius:12px;box-shadow:0 5px 0 var(--table-edge);display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px 3px;margin-bottom:16px}
.ttop svg{width:30px;height:38px}
.spot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:92px;position:relative}
.chair{width:44px;height:12px;border-radius:6px;background:var(--chair);margin-top:3px}
.who{background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;color:var(--ink)}
.av{width:40px;height:40px;border-radius:50%;background:var(--c,#7a8a80);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:18px;border:3px solid var(--surface);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who.me .av{outline:2px dashed var(--accent);outline-offset:2px}
.who.sel .av{outline:3px solid var(--crema);outline-offset:2px}
.mmsp svg{width:54px;height:66px;display:block;shape-rendering:crispEdges}
.who .mmsp{transition:transform .15s}
.who:hover .mmsp{transform:translateY(-2px)}
.who.sel .mmsp svg{filter:drop-shadow(0 0 0 var(--crema)) drop-shadow(0 0 4px var(--crema))}
.who.me .nm{color:var(--accent)}
.spot{min-height:118px}
.mm{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.mm summary{cursor:pointer;list-style:none;padding:7px 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.mm summary::-webkit-details-marker{display:none}
.mm summary::after{content:"▾";color:var(--muted);margin-left:auto}
.mm[open] summary::after{content:"▴"}
.mmbody{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;padding:4px 14px 14px}
.mmprev{background:repeating-linear-gradient(90deg,var(--floor1) 0 20px,var(--floor2) 20px 40px);border-radius:10px;padding:10px 18px;display:grid;place-items:center}
.mmprev svg{width:81px;height:99px;display:block;shape-rendering:crispEdges}
.mmopts{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 260px}
.mmrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mmrow > span{width:4.5em;font-size:13px;color:var(--muted)}
.sw2{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);padding:0}
.sw2[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seat .mmsp{position:relative;z-index:1}
.seat .mmsp svg{width:72px;height:88px}
.nm{font-size:12px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.ftime{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:1.2em;font-variant-numeric:tabular-nums}
.bub{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);
  border-radius:11px;padding:3px 9px;font-size:12px;line-height:1.35;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.1);z-index:2}
.bub::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--surface)}
.bub.say{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.bub.say::after{border-top-color:var(--accent)}
.bub.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.08)}}
.sitbtn{width:40px;height:40px;border-radius:50%;border:2px dashed var(--chair);background:transparent;font-size:11px;color:var(--muted)}
.sitbtn:hover{border-color:var(--accent);color:var(--accent)}
.saybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saybar input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 14px;flex:1 1 180px;min-width:0}
.fsel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px}
.fsel b{margin-right:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:12.5px}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.sit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fempty{margin:0;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 18px;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .bar{grid-template-columns:1fr}
  .steps{flex-direction:row;flex-wrap:wrap}
  .steps li{grid-template-columns:20px auto;font-size:12.5px;padding:4px 8px}
  .steps li .dots{display:none}
  .stage{grid-template-columns:1fr;justify-items:center;text-align:center;min-height:0}
  .say-box{width:100%;align-items:center}
  .meter,.meter-scale{width:100%}
  .station{grid-template-columns:repeat(4,minmax(0,1fr))}
  .done,.study{grid-template-columns:1fr}
  .done .cupwrap{order:-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= CAFE SKIN =================
   Inside a small neighbourhood café: plaster wall over deep-green wainscot,
   oak floor, brass pendant lamps, chalkboard, a window that follows the real clock. */
:root{
  --bg:#E8DFD0; --surface:#FBF8F2; --surface-2:#F2ECE2; --ink:#2A211B; --muted:#6D6255; --line:#D7CBB8;
  --accent:#2F5D4C; --accent-ink:#FFFFFF; --accent-soft:#DCE8E0; --crema:#A8692A;
  --plaster:#EFE7DA; --wain:#2F5D4C; --wain2:#28503F; --oak:#B37D4E; --oak2:#946339; --brass:#C49A4A;
  --floor1:#C79F76; --floor2:#BA926A; --table:#6E4528; --table-edge:#4F301B; --chair:#3A2719;
  --tilew:#F8F6F1; --grout:#DED7CA; --sign-ink:#FFF4E2; --glow:.35;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1612; --surface:#25201B; --surface-2:#2D2721; --ink:#F0E7DA; --muted:#AB9E8D; --line:#3F362C;
  --accent:#86C9AC; --accent-ink:#10201A; --accent-soft:#233A30; --crema:#E3A75E;
  --plaster:#2A241E; --wain:#1C362C; --wain2:#182F26; --oak:#7E5636; --oak2:#68462B; --brass:#D2AE62;
  --floor1:#3B2D22; --floor2:#34281E; --table:#8A5C38; --table-edge:#62401F; --chair:#A47C58;
  --tilew:#2B2621; --grout:#3A332B; --sign-ink:#FFF1DC; --glow:.6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1612; --surface:#25201B; --surface-2:#2D2721; --ink:#F0E7DA; --muted:#AB9E8D; --line:#3F362C;
  --accent:#86C9AC; --accent-ink:#10201A; --accent-soft:#233A30; --crema:#E3A75E;
  --plaster:#2A241E; --wain:#1C362C; --wain2:#182F26; --oak:#7E5636; --oak2:#68462B; --brass:#D2AE62;
  --floor1:#3B2D22; --floor2:#34281E; --table:#8A5C38; --table-edge:#62401F; --chair:#A47C58;
  --tilew:#2B2621; --grout:#3A332B; --sign-ink:#FFF1DC; --glow:.6; color-scheme:dark}
.app[data-sky="day"]{--sky1:#8FC9EC;--sky2:#DDF0FA;--win-lit:transparent}
.app[data-sky="sunset"]{--sky1:#E9875E;--sky2:#F6CF97;--win-lit:#FFD27A}
.app[data-sky="night"]{--sky1:#0E1830;--sky2:#2B3E66;--win-lit:#FFD27A}

body{background:var(--bg);background-image:radial-gradient(rgba(120,90,60,.06) 1px,transparent 1.2px);background-size:7px 7px}
.app{gap:0}
.app > section, .app > .friends{margin-top:16px}

/* awning + hanging sign */
.awning{position:relative;height:30px;border-radius:8px 8px 0 0;z-index:1;
  background:repeating-linear-gradient(90deg,var(--accent) 0 32px,var(--surface) 32px 64px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;
  background:radial-gradient(circle at 16px 0,var(--accent) 11.5px,transparent 12px) 0 0/64px 12px repeat-x,
             radial-gradient(circle at 48px 0,var(--surface) 11.5px,transparent 12px) 0 0/64px 12px repeat-x}
.sign{margin-top:18px;background:linear-gradient(180deg,var(--oak),var(--oak2));border:none;color:var(--sign-ink);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.15);border-radius:10px}
.sign h1{color:var(--sign-ink);font-size:26px}
.sign h1:hover,.sign h1:focus{border-bottom-color:rgba(255,255,255,.4)}
.sign .open{color:#FFE7A8;border-color:#FFE7A8;text-shadow:0 0 8px rgba(255,210,120,.8)}
.sign .open::before{background:#FFD36E;box-shadow:0 0 8px #FFD36E}
.sign .ledger{color:rgba(255,244,226,.8)}
.sign .ledger b{color:var(--sign-ink)}

/* hall scene */
.friends{padding:0;overflow:hidden;gap:0;border-radius:14px;border:1px solid var(--line)}
.friends .fhead{padding:12px 16px;background:var(--surface)}
.scene{display:flex;flex-direction:column}
.wall{position:relative;height:210px;display:grid;grid-template-columns:1.25fr 1fr 1.1fr;gap:18px;align-items:end;padding:0 22px 0;
  background:linear-gradient(180deg,var(--plaster) 0 60%,var(--brass) 60% calc(60% + 4px),var(--wain) calc(60% + 4px));overflow:hidden}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(40% - 4px);pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 6px,var(--wain2) 6px 8px,transparent 8px 70px);opacity:.9}
.lamps{position:absolute;inset:0 0 auto;height:70px;pointer-events:none;z-index:2}
.lamps i{position:absolute;top:0;width:2px;height:34px;background:var(--ink);opacity:.7}
.lamps i::before{content:"";position:absolute;top:32px;left:-15px;width:32px;height:16px;border-radius:16px 16px 3px 3px;background:var(--brass);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.lamps i::after{content:"";position:absolute;top:44px;left:-60px;width:122px;height:150px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 0,rgba(255,206,120,var(--glow)),transparent 65%)}
.lamps i:nth-child(1){left:18%}.lamps i:nth-child(2){left:50%;height:26px}.lamps i:nth-child(3){left:82%}
.lamps i:nth-child(2)::before{top:24px}.lamps i:nth-child(2)::after{top:36px}
.window{position:relative;align-self:start;margin-top:30px;height:136px;border-radius:70px 70px 4px 4px;border:6px solid var(--oak2);overflow:hidden;z-index:1;
  background:linear-gradient(180deg,var(--sky1),var(--sky2));box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.window::before{content:"";position:absolute;inset:0;z-index:2;
  background:linear-gradient(90deg,transparent calc(50% - 2px),var(--oak2) calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px)),
             linear-gradient(180deg,transparent 55%,var(--oak2) 55% calc(55% + 4px),transparent calc(55% + 4px))}
.window .street{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:1;
  background:
   radial-gradient(circle,var(--win-lit) 2px,transparent 2.5px) 6px 10px/14px 13px,
   linear-gradient(180deg,transparent 0 30%,#5A6170 30%) 0 0/34% 100% no-repeat,
   linear-gradient(180deg,transparent 0 8%,#4A5160 8%) 40% 0/26% 100% no-repeat,
   linear-gradient(180deg,transparent 0 22%,#535A69 22%) 100% 0/40% 100% no-repeat}
.app[data-sky="day"] .window .street{opacity:.55}
.window .sun{position:absolute;width:26px;height:26px;border-radius:50%;top:22px;right:24%;z-index:0}
.app[data-sky="day"] .sun{background:#FFF3B0;box-shadow:0 0 20px #FFE680}
.app[data-sky="sunset"] .sun{background:#FFC27A;top:46px;box-shadow:0 0 24px #FF9F5A}
.app[data-sky="night"] .sun{background:transparent;box-shadow:-7px 4px 0 0 #F3E9C6;top:16px}
.app[data-sky="night"] .window .sky{position:absolute;inset:0;background:radial-gradient(circle,#fff 0.7px,transparent 1.2px) 0 0/23px 19px,radial-gradient(circle,#fff 0.6px,transparent 1px) 9px 7px/31px 27px;opacity:.7}
.wallboard{position:relative;z-index:1;align-self:center;margin-top:20px;height:112px;border-radius:6px;border:7px solid var(--oak);
  background:#25332D;color:#F1EEE4;text-align:left;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;
  box-shadow:0 4px 0 rgba(0,0,0,.18);min-width:0}
.wallboard small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#B9C7BE}
.wallboard strong{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wallboard span{font-size:12px;color:#C9D3CC}
.wallboard:hover{transform:rotate(-1deg)}
.barside{position:relative;z-index:1;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0}
.shelf{display:flex;justify-content:center;gap:10px;align-items:flex-end;margin-bottom:10px;border-bottom:6px solid var(--oak);padding:0 10px;width:100%}
.shelf svg{height:44px;width:auto}
.machine{border:none;background:none;padding:0;display:block;position:relative}
.machine svg{height:72px;width:auto;display:block}
.machine::after{content:"주문 받기";position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font-size:11px;white-space:nowrap;
  background:var(--crema);color:#1b120a;border-radius:99px;padding:1px 8px;opacity:0;transition:.15s}
.machine:hover::after,.machine:focus-visible::after{opacity:1}
.counterbar{width:100%;height:14px;background:linear-gradient(180deg,var(--oak),var(--oak2));border-radius:3px 3px 0 0}
.floor{border:none;border-radius:0;border-top:8px solid var(--oak2);padding:50px 18px 22px;gap:44px 22px;
  background:repeating-linear-gradient(90deg,var(--floor1) 0 46px,var(--floor2) 46px 48px,var(--floor1) 48px 94px),var(--floor1)}
.friends .saybar,.friends .mm,.friends .fsel,.friends .fempty{margin:10px 16px 0}
.friends .fempty{margin-bottom:12px}
.friends .mm{margin-bottom:14px}

/* tables & chairs */
.tbl{grid-template-columns:64px minmax(0,1fr) 64px;align-items:start}
.tcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:90px}
.tcups{display:flex;justify-content:space-between;width:100%;padding:0 8px;align-items:flex-end;height:38px}
.tcups svg{width:30px;height:38px}
.tplank{width:100%;height:11px;border-radius:4px;background:var(--table);box-shadow:0 3px 0 var(--table-edge)}
.tleg{width:9px;height:34px;background:var(--table-edge)}
.tfoot{width:44px;height:6px;border-radius:3px;background:var(--table-edge)}
.spot{min-height:0;justify-content:flex-start}
.who{gap:0}
.seatbox{position:relative;width:60px;height:90px}
.seatbox > svg.chairsv{position:absolute;left:2px;bottom:0;width:56px;height:74px}
.seatbox .mmsp{position:absolute;left:50%;bottom:11px;transform:translateX(-50%)}
.who:hover .mmsp{transform:translate(-50%,-2px)}
.seatbox .bub{bottom:auto;top:-4px;transform:translate(-50%,-100%)}
.bub.pop{animation:pop2 .35s ease-out}
@keyframes pop2{0%{transform:translate(-50%,-100%) scale(.6);opacity:0}70%{transform:translate(-50%,-100%) scale(1.08)}}
.nm{margin-top:3px}
.sitbtn{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:auto;height:auto;border-radius:99px;padding:2px 9px;border:1.5px dashed var(--surface);background:rgba(0,0,0,.25);color:#fff;font-size:11px}
.sitbtn:hover{border-color:#fff;background:var(--accent);color:var(--accent-ink)}

/* bar = behind the counter */
.stage{background-color:var(--tilew);background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);
  background-size:36px 18px;border:none;border-bottom:10px solid var(--oak2);border-radius:14px 14px 0 0}
.say-box{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:0 2px 0 var(--line)}
.counter{gap:0}
.station{border-radius:0 0 14px 14px;background:linear-gradient(180deg,var(--oak),var(--oak2));box-shadow:inset 0 6px 0 rgba(0,0,0,.08);padding:14px 12px}
.ing{background:var(--surface);box-shadow:0 3px 0 var(--table-edge)}

/* menu board on a wooden frame, ledger as receipt */
.board{box-shadow:inset 0 0 0 8px var(--oak),inset 0 0 0 10px var(--oak2),0 6px 18px rgba(0,0,0,.12);padding:24px 22px 22px}
.panel{background:var(--surface)}

/* study = window seat */
.seat{background:linear-gradient(180deg,var(--sky1),var(--sky2));border:6px solid var(--oak2);border-radius:14px;padding-top:26px}
.seat::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(50% - 3px),var(--oak2) calc(50% - 3px) calc(50% + 3px),transparent calc(50% + 3px)),
             linear-gradient(180deg,transparent 40%,var(--oak2) 40% calc(40% + 5px),transparent calc(40% + 5px))}
.seat::after{height:96px;background:linear-gradient(180deg,var(--table),var(--table-edge));border-top:none;box-shadow:0 -4px 0 rgba(0,0,0,.12)}
.seat .lbl{background:var(--surface);border-radius:99px;padding:2px 14px}
.seat .sip{background:var(--surface);border-radius:8px;padding:2px 10px;margin-bottom:56px}
.seat .studyrow{position:relative;z-index:1;display:flex;align-items:flex-end;gap:8px}

@media (max-width:760px){
  .wall{grid-template-columns:1fr 1fr;height:190px;padding:0 14px}
  .barside{display:none}
  .window{height:120px}
}

/* ===== illustrated hall ===== */
:root{--sc-wall:#F2EDE4;--sc-floor:#E4DCD0;--sc-base:#D6CCBE;--sc-brick:rgba(110,90,70,.13);--beam:.28;--lampglow:.55;--terr:.75;--stars:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sc-wall:#3A332B;--sc-floor:#2E2924;--sc-base:#26211C;--sc-brick:rgba(0,0,0,.28);--beam:.05;--lampglow:1;--terr:.35}}
:root[data-theme="dark"]{--sc-wall:#3A332B;--sc-floor:#2E2924;--sc-base:#26211C;--sc-brick:rgba(0,0,0,.28);--beam:.05;--lampglow:1;--terr:.35}
.app[data-sky="night"]{--stars:1}
.app[data-sky="night"] .hall{--beam:0}
.sunmoon{fill:#FFF3B0}
.app[data-sky="sunset"] .sunmoon{fill:#FFB774;cy:190px}
.app[data-sky="night"] .sunmoon{fill:#F3E9C6;r:10px}
.hallscroll{overflow-x:auto;overflow-y:hidden;background:var(--sc-floor);scrollbar-width:thin}
.hall{position:relative;width:100%;min-width:780px;aspect-ratio:1000/900}
.hallsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}
.hud > *{pointer-events:auto}
.bub.hb{bottom:auto;transform:translate(-50%,-100%);font-size:12.5px;padding:4px 10px;max-width:170px;box-shadow:0 3px 10px rgba(40,30,20,.16);pointer-events:none;z-index:3}
.hname{position:absolute;transform:translateX(-50%);font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--ink);
  background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:99px;padding:0 8px;line-height:1.5;pointer-events:none;z-index:2}
.hname.me{color:var(--accent)}
.hname .ftime{display:block;text-align:center;font-size:.92em;line-height:1.25;margin:0;font-variant-numeric:tabular-nums}
.hname .nl{display:flex;align-items:center;justify-content:center;min-width:0}
.hname .nm{font-weight:inherit;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hname .nl>i,.hname .fh{flex:none}
.hname.human{border-radius:9px;padding-top:1px;padding-bottom:1px}
.hname .ftime:empty{display:none}
.hhit{position:absolute;background:transparent;border:none;border-radius:12px;padding:0;cursor:pointer;z-index:1}
.hhit:hover{background:rgba(255,255,255,.14)}
.hhit.sel{box-shadow:0 0 0 2.5px var(--crema);background:rgba(255,230,180,.12)}
.hsit{position:absolute;transform:translate(-50%,-50%);border-radius:99px;padding:3px 10px;border:1.5px dashed #fff;background:rgba(40,30,20,.45);color:#fff;font-size:11.5px;z-index:2}
.hsit:hover{background:var(--accent);color:var(--accent-ink);border-style:solid}
.chalk{position:absolute;background:transparent;border:none;color:#EEF0E8;text-align:left;
  padding:4px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;font-family:var(--body);z-index:1;min-width:0}
.chalk small{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#B9C7BE}
.chalk strong{font-family:var(--display);font-weight:400;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chalk span{font-size:10.5px;color:#C9D3CC}

/* ---------- data ---------- */

const R=[
 {id:'ia',n:'아이스 아메리카노',p:4500,ice:1,mixC:[66,38,22,.93],steps:[cupStep('icecup'),tap('ice',3,0,'얼음 3스쿱'),pour('water',55,65,'정수 붓기'),pour('espresso',78,88,'샷 추출',1)]},
 {id:'ha',n:'따뜻한 아메리카노',p:4500,mixC:[60,34,19,1],steps:[cupStep('mug'),pour('espresso',18,28,'샷 추출'),pour('hotwater',76,88,'뜨거운 물 붓기',1)]},
 {id:'cl',n:'카페 라떼',p:5000,mixC:[192,152,112,1],steps:[cupStep('mug'),pour('espresso',18,28,'샷 추출'),steam,pour('milk',78,90,'스팀 우유 붓기',1)]},
 {id:'vl',n:'아이스 바닐라 라떼',p:5500,ice:1,steps:[cupStep('icecup'),tap('vanilla',2,5,'바닐라 2펌프'),tap('ice',3,0,'얼음 3스쿱'),pour('milk',56,68,'우유 붓기'),pour('espresso',76,88,'샷 올리기')]},
 {id:'ml',n:'아이스 말차 라떼',p:5500,ice:1,steps:[cupStep('icecup'),tap('ice',3,0,'얼음 3스쿱'),pour('milk',55,68,'우유 붓기'),tap('matcha',6,0,'말차 6번 휘젓기'),pour('matcha',78,90,'말차 올리기')]},
 {id:'es',n:'아인슈페너',p:6000,ice:1,steps:[cupStep('icecup'),tap('ice',3,0,'얼음 3스쿱'),pour('water',40,52,'정수 붓기'),pour('espresso',62,72,'샷 추출','mid'),pour('cream',86,96,'크림 얹기')],midC:[64,36,20,.95]},
 {id:'cb',n:'콜드브루',p:5000,ice:1,mixC:[86,48,26,.92],steps:[cupStep('icecup'),tap('ice',3,0,'얼음 3스쿱'),pour('coldbrew',42,54,'콜드브루 원액'),pour('water',76,88,'정수 붓기',1)]},
 {id:'le',n:'레몬에이드',p:5500,ice:1,mixC:[245,222,128,.82],steps:[cupStep('icecup'),tap('lemon',3,6,'레몬청 3스푼'),tap('ice',3,0,'얼음 3스쿱'),pour('soda',76,88,'탄산수 붓기',1)]},
 {id:'hc',n:'핫초코',p:5000,mixC:[128,80,54,1],steps:[cupStep('mug'),tap('choco',3,4,'초코 3스푼'),steam,pour('milk',78,90,'스팀 우유 붓기',1)]},
 {id:'jc',n:'자바칩 프라푸치노',p:6300,ice:1,special:1,mixC:[121,84,61,1],steps:[cupStep('icecup'),tap('choco',3,5,'초코 3스푼'),tap('ice',3,0,'얼음 3스쿱'),pour('milk',55,68,'우유 붓기'),pour('espresso',72,82,'샷 추출',1),pour('cream',88,97,'휘핑 올리기')]},
];
const GUESTS=[
 ['단골 하은','늘 마시던 걸로요! 아, 오늘은 {n}로 할게요.'],
 ['시험기간 대학생','{n} 하나요… 오늘 밤샐 거라서요.'],
 ['출근길 직장인','{n} 빨리 부탁드려요, 9시 회의예요!'],
 ['강아지 산책 중인 손님','{n} 한 잔 주세요. 밖에서 기다릴게요.'],
 ['창가 자리 작가님','{n} 하나랑, 콘센트 자리 있을까요?'],
 ['처음 온 손님','여기 {n} 맛있다고 해서 왔어요.'],
];

/* ---------- storage ---------- */
const KEY='barista.v1';
let DB={name:'나의 작은 카페',days:{},order:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)DB=Object.assign(DB,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const day=()=>DB.days[today()]||(DB.days[today()]={cups:[],tips:0,focus:0});
const $=id=>document.getElementById(id);
const won=n=>'₩'+n.toLocaleString('ko-KR');
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);

/* ---------- cup drawing ---------- */
const GEO={
 icecup:{clip:'M45 30 L155 30 L141 222 Q140 227 135 227 L65 227 Q60 227 59 222 Z',yb:225,yt:40},
 mug:{clip:'M38 72 L152 72 L152 190 Q152 214 128 214 L62 214 Q38 214 38 190 Z',yb:212,yt:82},
};
const CUBES=[[80,178,-8],[114,184,10],[92,146,14],[122,140,-6],[74,112,6],[110,104,-12]];
let clipN=0;
const rgba=c=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${c[3]})`;
function cupSVG(kind,layers,o={}){
  if(!kind) return `<svg viewBox="0 0 200 250" aria-hidden="true"><rect x="40" y="200" width="120" height="30" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/><text x="100" y="190" text-anchor="middle" font-size="14" fill="var(--muted)" font-family="var(--body)">컵을 먼저 꺼내요</text></svg>`;
  const g=GEO[kind],id='cc'+(++clipN),f=o.f??1;
  const y=l=>g.yb-l/100*(g.yb-g.yt);
  let acc=0,liq='';
  for(const L of layers){const a=L.a*f;if(a<=0.05)continue;const top=Math.min(100,acc+a);
    liq+=`<rect x="0" y="${y(top).toFixed(1)}" width="200" height="${(y(acc)-y(top)+.8).toFixed(1)}" fill="${rgba(L.c)}"/>`;acc=top;}
  if(acc>0.5) liq+=`<rect x="0" y="${y(acc).toFixed(1)}" width="200" height="2.5" fill="rgba(255,255,255,.4)"/>`;
  let cubes='';const s=(o.iceScale??1)*28;
  if(kind==='icecup') for(let i=0;i<Math.min(6,(o.ice||0)*2);i++){const[cx,cy,r]=CUBES[i];
    cubes+=`<rect x="${cx-s/2}" y="${cy-s/2}" width="${s}" height="${s}" rx="${5*(o.iceScale??1)}" transform="rotate(${r} ${cx} ${cy})" fill="rgba(255,255,255,.42)" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>`;}
  let band='';
  if(o.band){const a=y(o.band[1]),b=y(o.band[0]);
    band=`<rect x="0" y="${a}" width="200" height="${b-a}" fill="var(--accent)" opacity=".16"/><line x1="0" x2="200" y1="${a}" y2="${a}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/><line x1="0" x2="200" y1="${b}" y2="${b}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>`;}
  const outline=`<path d="${g.clip}" fill="none" stroke="var(--cupline)" stroke-width="3" stroke-linejoin="round"/>`;
  const extra=kind==='mug'
    ?`<path d="M152 98 C188 98 188 168 152 168" fill="none" stroke="var(--cupline)" stroke-width="9" stroke-linecap="round"/><ellipse cx="95" cy="222" rx="80" ry="8" fill="var(--glass)" stroke="var(--cupline)" stroke-width="2.5"/>`
    :`<line x1="40" x2="160" y1="30" y2="30" stroke="var(--cupline)" stroke-width="5" stroke-linecap="round"/>`;
  const straw=o.straw&&kind==='icecup'?`<path d="M116 212 L138 -4" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" opacity=".9"/>`:'';
  const top=kind==='mug'?72:30;
  const st=o.steam?`<g class="steam"><path d="M80 ${top-6} q-8 -12 0 -24 q8 -12 0 -24"/><path d="M100 ${top-4} q-8 -12 0 -24 q8 -12 0 -24"/><path d="M120 ${top-6} q-8 -12 0 -24 q8 -12 0 -24"/></g>`:'';
  return `<svg viewBox="0 0 200 250" aria-hidden="true"><defs><clipPath id="${id}"><path d="${g.clip}"/></clipPath></defs>${straw}<path d="${g.clip}" fill="var(--glass)"/><g clip-path="url(#${id})">${liq}${cubes}${band}</g>${outline}${extra}${st}</svg>`;
}
function ideal(r){
  let L=[],ice=0,kind=null;const lvl=()=>L.reduce((s,x)=>s+x.a,0);
  const add=(ing,a)=>{const t=L.at(-1);if(t&&t.ing===ing)t.a+=a;else L.push({ing,a,c:ING[ing].c.slice()})};
  for(const s of r.steps){
    if(s.t==='cup')kind=s.ing;else if(s.t==='tap'){if(s.ing==='ice')ice+=s.n;else if(s.add)add(s.ing,s.add*s.n)}
    else if(s.t==='pour'){add(s.ing,(s.min+s.max)/2-lvl());if(s.mix)L=[{ing:'mix',a:lvl(),c:(s.mix==='mid'?r.midC:r.mixC).slice()}]}}
  return{kind,L,ice};
}

/* ---------- screens ---------- */
const SCR=['scrMenu','scrBar','scrDone','scrStudy'];
let CUR='scrMenu';
function show(id){CUR=id;SCR.forEach(s=>$(s).hidden=s!==id);window.scrollTo({top:0});syncPresence();if(typeof saveStudy==='function')saveStudy()}

function renderLedger(){
  const d=day(),serve=d.cups.length;
  $('ledger').innerHTML=`<span>오늘 <b>${serve}</b>잔</span><span>공부 <b>${d.focus}</b>분</span><span>팁 <b>${won(d.tips)}</b></span>`;
  renderPick();
  const rows=$('rows');
  if(!d.cups.length){rows.innerHTML='<p class="empty">출근 도장만 찍었어요. 직원 음료 한 잔 만들고 근무 시작해볼까요?</p>';return}
  rows.innerHTML=d.cups.slice().reverse().map(c=>`<div class="row"><span class="t">${c.at}</span><span>${c.n} <span class="stars">${starStr(c.st)}</span>${c.guest?` <span class="sub" style="font-size:12px">· ${c.guest}</span>`:''}</span><span class="r">${c.guest?'팁 '+won(c.tip):(c.min?c.min+'분 공부':(c.ordered?'나에게 시킨 음료':c.auto?'공부 중 자동 서빙':'직원 음료'))}</span></div>`).join('');
}
function renderMenu(){
  $('menu').innerHTML=R.filter(r=>!r.special).map(r=>{const i=ideal(r);return `<button class="mcard" data-id="${r.id}">${cupSVG(i.kind,i.L,{ice:i.ice,straw:r.ice})}<span class="nm">${r.n}</span><span class="pr">${won(r.p)} · ${r.steps.length}단계</span><span class="tag ${r.ice?'ice':'hot'}">${r.ice?'ICE':'HOT'}</span></button>`}).join('');
  $('menu').querySelectorAll('.mcard').forEach(b=>b.onclick=()=>startOrder(R.find(r=>r.id===b.dataset.id),null));
  renderLedger();
}
$('takeOrder').onclick=()=>{const RR=R.filter(x=>!x.special),r=RR[Math.random()*RR.length|0],g=GUESTS[Math.random()*GUESTS.length|0];startOrder(r,{who:g[0],say:g[1].replace('{n}',r.n)})};
$('toMenu').onclick=()=>{stopLoops();show('scrMenu');renderMenu()};
const nameEl=$('cafeName');nameEl.textContent=DB.name;
nameEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nameEl.blur()}});
nameEl.addEventListener('blur',()=>{DB.name=nameEl.textContent.trim().slice(0,24)||'나의 작은 카페';nameEl.textContent=DB.name;save()});

/* ---------- bar ---------- */
let C=null;
function startOrder(r,guest){
  DB.order=(DB.order||0)+1;save();
  C={r,guest,i:0,L:[],ice:0,kind:null,scores:[],miss:0,stepMiss:0,taps:0,temp:20,pouring:false,steaming:false,busy:false,start:0};
  $('tNo').textContent='ORDER #'+String(DB.order).padStart(3,'0');$('tTime').textContent=hhmm();
  $('tWho').textContent=guest?guest.who:'나 (오늘 근무자)';
  $('tSay').textContent=guest?'“'+guest.say+'”':'“직원 음료 한 잔. 오늘도 공부 화이팅.”';
  $('tName').textContent=r.n;
  $('fb').textContent='';$('fb').className='fb';
  buildStation();show('scrBar');renderBar();
}
function buildStation(){
  $('station').innerHTML=ORDER.map(k=>{const g=ING[k];return `<button class="ing" data-ing="${k}" id="ing-${k}"><span class="sw ${g.cup?'cup':''}" style="${g.cup?'':'background:'+g.sw}"></span>${g.l}</button>`}).join('');
  $('station').querySelectorAll('.ing').forEach(b=>{
    const k=b.dataset.ing;
    b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('on');press(k,b)});
    const up=()=>{b.classList.remove('on');release()};
    b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();b.classList.add('on');press(k,b)}});
    b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){b.classList.remove('on');release()}});
  });
}
const lvl=()=>C.L.reduce((s,x)=>s+x.a,0);
const step=()=>C.r.steps[C.i];
function addLiq(ing,a){const t=C.L.at(-1);if(t&&t.ing===ing)t.a+=a;else C.L.push({ing,a,c:ING[ing].c.slice()})}
function fb(txt,cls){const e=$('fb');e.textContent=txt;e.className='fb '+(cls||'')}

function press(k,btn){
  if(!C||C.busy||C.i>=C.r.steps.length)return;
  const s=step();
  if(k!==s.ing){
    C.miss++;C.stepMiss++;btn.classList.remove('no');void btn.offsetWidth;btn.classList.add('no');
    if(s.t==='cup'&&ING[k].cup) fb(`이 메뉴는 ${ING[s.ing].l}에 담아요.`,'warn');
    else if(C.stepMiss>=2) fb(`지금은 ${ING[s.ing].l} 차례예요. 반짝이는 버튼!`,'warn');
    else fb('앗, 순서가 달라요. 주문서를 확인해요.','warn');
    renderBar();return;
  }
  if(s.t==='cup'){C.kind=k;C.scores.push(3);fb('좋아요, 컵 준비 완료.','good');next();return}
  if(s.t==='tap'){
    C.taps++;
    if(k==='ice')C.ice++;else if(s.add)addLiq(k,s.add);
    if(C.taps>=s.n){C.scores.push(3);fb(k==='matcha'?'거품 곱게 올라왔어요.':'정확해요!','good');next()}else{fb('','');renderBar()}
    return;
  }
  if(s.t==='pour'){C.pouring=true;loop()}
  if(s.t==='steam'){C.steaming=true;loop()}
}
let raf=0,lastT=0;
function loop(){cancelAnimationFrame(raf);lastT=performance.now();raf=requestAnimationFrame(tick)}
function tick(t){
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;const s=step();
  if(C.pouring){addLiq(s.ing,ING[s.ing].rate*dt);if(lvl()>=100){const over=lvl()-100;C.L.at(-1).a-=over;release();return}}
  else if(C.steaming){C.temp+=13*dt;if(C.temp>=92){release();return}}
  else return;
  renderBar();raf=requestAnimationFrame(tick);
}
function release(){
  if(!C)return;const s=step();
  if(C.pouring){C.pouring=false;cancelAnimationFrame(raf);
    const v=lvl();
    if(v<s.min){fb(v<s.min-12?'더 따라주세요, 꾹 누르고 있기!':'조금만 더!','warn');renderBar();return}
    let sc;const extra=s.ing==='espresso'?` (추출 ${shotSec()}초)`:'';
    if(v>=100){sc=1;fb('앗, 넘쳤어요! 행주 출동…'+extra,'bad')}
    else if(v<=s.max){sc=3;fb((s.ing==='espresso'?'완벽한 크레마!':'딱 선까지, 깔끔해요!')+extra,'good')}
    else if(v<=s.max+7){sc=2;fb('살짝 많지만 괜찮아요.'+extra,'warn')}
    else{sc=1;fb('많이 넘쳤어요… 다음엔 더 일찍 손 떼기.'+extra,'bad')}
    C.scores.push(sc);next();
  } else if(C.steaming){C.steaming=false;cancelAnimationFrame(raf);
    const v=C.temp;
    if(v<s.min){fb(`아직 ${Math.round(v)}°C예요. 더 데워주세요.`,'warn');renderBar();return}
    let sc;if(v<=s.max){sc=3;fb(`${Math.round(v)}°C, 벨벳 같은 우유 완성!`,'good')}else if(v<=s.max+8){sc=2;fb(`${Math.round(v)}°C, 조금 뜨거워요.`,'warn')}else{sc=1;fb(`${Math.round(v)}°C… 우유가 탔어요.`,'bad')}
    C.scores.push(sc);next();
  }
}
function shotSec(){const s=step();const base=C.start,mid=(s.min+s.max)/2;return Math.max(0,Math.round((lvl()-base)/(mid-base)*27))}
function next(){
  const s=step();C.i++;C.taps=0;C.stepMiss=0;C.temp=20;C.start=lvl();
  if(s.mix){mix(s.mix==='mid'?C.r.midC:C.r.mixC,()=>{C.start=lvl();after()});}else after();
}
function after(){renderBar();if(C.i>=C.r.steps.length){C.busy=true;setTimeout(finish,700)}}
function mix(target,cb){
  C.busy=true;const from=C.L.map(l=>l.c.slice()),t0=performance.now();$('hint').textContent='스틱으로 휘휘 젓는 중…';
  const f=t=>{const k=Math.min(1,(t-t0)/1100);C.L.forEach((l,i)=>{l.c=from[i].map((v,j)=>v+(target[j]-v)*k)});drawCup();
    if(k<1)requestAnimationFrame(f);else{C.L=[{ing:'mix',a:lvl(),c:target.slice()}];C.busy=false;cb()}};
  requestAnimationFrame(f);
}
function drawCup(extra={}){
  const s=step();
  const band=s&&s.t==='pour'&&C.kind?[s.min,s.max]:null;
  const hot=C.kind==='mug'&&lvl()>20;
  $('cupBar').innerHTML=cupSVG(C.kind,C.L,Object.assign({ice:C.ice,band,steam:hot},extra));
}
function renderBar(){
  const steps=C.r.steps,cur=C.i;
  $('tSteps').innerHTML=steps.map((s,i)=>`<li class="${i<cur?'done':i===cur?'now':''}"><span>${s.lb}</span><span class="dots">${i<cur&&C.scores[i]!=null?'★'.repeat(C.scores[i]):''}</span></li>`).join('');
  drawCup();
  const s=steps[cur];
  document.querySelectorAll('.ing.hintme').forEach(b=>b.classList.remove('hintme'));
  $('meterWrap').hidden=!(s&&s.t==='steam');$('readout').textContent='';
  if(!s){$('hint').textContent='완성! 서빙 준비 중…';$('sub').textContent='';return}
  if(C.stepMiss>=2)$('ing-'+s.ing).classList.add('hintme');
  if(s.t==='cup'){$('hint').textContent=`${ING[s.ing].l}을 꺼내요`;$('sub').textContent=C.r.ice?'아이스 메뉴는 투명한 아이스컵.':'따뜻한 메뉴는 유리 머그.'}
  else if(s.t==='tap'){$('hint').textContent=s.lb;$('sub').textContent=`${ING[s.ing].l} 버튼을 ${s.n}번 톡톡.`;$('readout').innerHTML=`${C.taps}<small>/ ${s.n}</small>`}
  else if(s.t==='pour'){$('hint').textContent=s.lb;$('sub').textContent=`${ING[s.ing].l} 버튼을 꾹 누르고, 점선 사이에서 손을 떼요.`;
    $('readout').innerHTML=s.ing==='espresso'?`${shotSec()}<small>초 추출 · 목표 25–30초</small>`:`${Math.round(lvl())}<small>% 채움</small>`}
  else if(s.t==='steam'){$('hint').textContent='우유 스팀';$('sub').textContent='스팀 피처를 꾹 눌러 데우고, 초록 구간에서 손을 떼요.';
    const p=v=>((v-20)/70*100);$('mFill').style.width=p(C.temp)+'%';$('mZone').style.left=p(s.min)+'%';$('mZone').style.width=(p(s.max)-p(s.min))+'%';
    $('readout').innerHTML=`${Math.round(C.temp)}<small>°C</small>`}
}
function stopLoops(){cancelAnimationFrame(raf);if(C){C.pouring=C.steaming=false}}

/* ---------- done ---------- */
let MADE=null;
function finish(){
  const avg=C.scores.reduce((a,b)=>a+b,0)/C.scores.length;
  const st=Math.max(1,Math.min(3,Math.round(avg-C.miss*0.2)));
  const tip=C.guest?(st===3?1500:st===2?800:300):0;
  MADE={r:C.r,kind:C.kind,L:C.L.map(l=>({...l,c:l.c.slice()})),ice:C.ice,st};
  const d=day();d.cups.push({n:C.r.n,st,at:hhmm(),guest:C.guest?C.guest.who:null,tip,min:0});d.tips+=tip;save();
  if(C.guest){guestArrive(C.guest.who,C.r.id);lastSig=''}
  MADE.idx=d.cups.length-1;MADE.left=1;saveCup();
  $('cupDone').innerHTML=cupSVG(MADE.kind,MADE.L,{ice:MADE.ice,straw:1,steam:MADE.kind==='mug'});
  $('dStars').textContent=starStr(st);
  $('dTitle').textContent=C.r.n+(C.guest?' 서빙 완료':' 완성');
  const lines=C.guest?[['방금 주문하신 분이 웃으면서 받아갔어요.','“음, 괜찮네요.” 하고 가셨어요.','“다음엔 더 잘 부탁해요~”'][3-st]]:[['카페에서 파는 것보다 맛있을지도.','충분히 맛있어요. 오늘 공부 메이트 완성.','조금 서툴러도 내가 만든 잔이 최고.'][3-st]];
  $('dLine').textContent=lines[0];
  $('dReceipt').innerHTML=`<div><span>${C.r.n}</span><span>${won(C.r.p)}</span></div><div><span>제조 실수</span><span>${C.miss}회</span></div><div><span>${C.guest?'받은 팁':'직원 음료'}</span><span>${C.guest?won(tip):'무료'}</span></div>`;
  const a=$('dActs');
  a.innerHTML=C.guest
    ?`<button class="btn crema" id="dNext">다음 손님 받기</button><button class="btn" id="dSit">직원 음료로 마시며 공부하기</button><button class="btn ghost" id="dMenu">메뉴판</button>`
    :`<button class="btn" id="dSit">이 잔 들고 휴게석으로</button><button class="btn ghost" id="dMenu">다른 메뉴 만들기</button>`;
  $('dSit').onclick=()=>openStudy();
  $('dMenu').onclick=()=>{show('scrMenu');renderMenu()};
  if($('dNext'))$('dNext').onclick=()=>$('takeOrder').click();
  renderLedger();show('scrDone');
}

/* ---------- study ---------- */
const PRESETS=[15,25,50,90];
let S={dur:25,elapsed:0,start:0,running:false,done:false},sT=0,wake=null;
let nextGuestAt=0,guestLeft=null,SERVE=null,serveT=0;
function openStudy(join){
  S={dur:S.dur||25,elapsed:0,start:0,running:false,done:false};
  nextGuestAt=0;guestLeft=null;$('sGuest').hidden=true;
  if(join){S.dur=join.dur;S.elapsed=Math.max(0,join.dur*60-join.rem);S.start=Date.now();S.running=true;clearInterval(sT);sT=setInterval(renderStudy,500);scheduleGuest(true)}
  $('sLbl').textContent=MADE.r.n;$('sDone').hidden=true;$('sNote').hidden=false;
  if(typeof spriteSVG==='function')$('meStudy').innerHTML=personSVG(lookOut(),{pose:'sit',face:'focus'});
  renderChips();renderStudy();show('scrStudy');
}
function renderChips(){
  $('chips').innerHTML=PRESETS.map(m=>`<button class="chip" data-m="${m}" aria-pressed="${S.dur===m}" ${S.running||S.elapsed>0?'disabled':''}>${m}분</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.dur=+c.dataset.m;renderChips();renderStudy()});
}
const elapsed=()=>S.elapsed+(S.running?(Date.now()-S.start)/1000:0);
/* keep the running session in the browser so an update or refresh doesn't reset it */
let lastSS=0;
function saveStudy(){try{
  if(CUR!=='scrStudy'||!MADE||S.done){localStorage.removeItem('barista.study');return}
  localStorage.setItem('barista.study',JSON.stringify({dur:S.dur,el:elapsed(),run:S.running,at:Date.now(),cup:MADE.r.id,idx:MADE.idx}));
}catch(e){}}
function renderStudy(){
  const tot=S.dur*60,e=Math.min(tot,elapsed()),p=e/tot,rem=Math.ceil(tot-e);
  $('clock').textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');
  $('prog').style.width=(p*100)+'%';
  $('cupStudy').innerHTML=cupSVG(MADE.kind,MADE.L,{ice:MADE.ice,iceScale:1-.55*p,f:1-.9*p,straw:1,steam:MADE.kind==='mug'&&p<.6});
  const left=Math.round((1-.9*p)*100);
  $('sSip').textContent=!S.running&&e===0?'갓 만든 한 잔. 타이머를 켜면 홀짝 시작.':p>=1?'다 마셨다!':`남은 양 약 ${left}% ${MADE.r.ice&&p>.4?'· 얼음이 녹는 중':''}`;
  $('sGo').textContent=S.running?'잠깐 멈춤':e>0?'이어서 공부':'공부 시작';
  if(p>=1&&!S.done)complete();
  else if(S.running)checkGuest();
  if(Date.now()-lastSS>4000){lastSS=Date.now();saveStudy()}
}
$('sGo').onclick=async()=>{
  if(S.done)return;
  if(S.running){S.elapsed=elapsed();S.running=false;clearInterval(sT);releaseWake();if(nextGuestAt)guestLeft=Math.max(0,nextGuestAt-Date.now())}
  else{if(guestLeft!=null){nextGuestAt=Date.now()+guestLeft;guestLeft=null}else if(!nextGuestAt)scheduleGuest(true);S.start=Date.now();S.running=true;clearInterval(sT);sT=setInterval(renderStudy,500);try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}
  renderChips();renderStudy();syncPresence();saveStudy();
};
$('sStop').onclick=()=>{
  const m=Math.floor(elapsed()/60);
  if(MADE&&!S.done&&elapsed()>0){MADE.left=Math.max(.1,1-.9*Math.min(1,elapsed()/(S.dur*60)));saveCup()}
  clearInterval(sT);S.running=false;releaseWake();
  nextGuestAt=0;guestLeft=null;if(SERVE){clearTimeout(serveT);finishServe()}
  if(m>0&&!S.done)logFocus(m);stopNoise();show('scrMenu');renderMenu();
};
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
function logFocus(m){const d=day();d.focus+=m;const c=d.cups[MADE.idx];if(c)c.min=(c.min||0)+m;save();renderLedger()}
function complete(){
  S.done=true;S.running=false;clearInterval(sT);releaseWake();logFocus(S.dur);ding();MADE.left=.1;saveCup();
  nextGuestAt=0;guestLeft=null;if(SERVE){clearTimeout(serveT);finishServe()}
  $('sNote').hidden=true;const d=$('sDone');d.hidden=false;
  d.innerHTML=`<h3>한 잔 다 마셨다! ${S.dur}분 집중 완료</h3><p>오늘 총 ${day().focus}분 공부했어요. 5분 쉬면서 다음 메뉴 골라볼까요?</p><div class="acts"><button class="btn" id="fMore">다음 잔 만들러 가기</button><button class="btn ghost" id="fRefill">같은 잔 리필</button></div>`;
  $('fMore').onclick=()=>{stopNoise();show('scrMenu');renderMenu()};
  $('fRefill').onclick=()=>{S={dur:S.dur,elapsed:0,start:0,running:false,done:false};MADE.left=1;saveCup();$('sDone').hidden=true;$('sNote').hidden=false;renderChips();renderStudy()};
  renderChips();renderStudy();syncPresence();saveStudy();
}

/* ---------- customers while studying: auto-serve ---------- */
function scheduleGuest(first){nextGuestAt=Date.now()+(first?(90+Math.random()*90):(240+Math.random()*300))*1000}
function checkGuest(){
  if(!S.running||SERVE||!nextGuestAt||Date.now()<nextGuestAt)return;
  // checked late = the page was hidden or asleep when the customer came in
  if(document.hidden||Date.now()-nextGuestAt>8000){missGuest();return}
  const RR=R.filter(x=>!x.special),r=RR[Math.random()*RR.length|0],g=GUESTS[Math.random()*GUESTS.length|0];
  SERVE={r,who:g[0]};  // regulars are served quietly, no sound
  const b=$('sGuest');b.hidden=false;b.className='guestbox serving';b.textContent='';
  const t=document.createElement('div');t.textContent=`딸랑! ${g[0]}님이 ${r.n} 주문. 바에 가서 만드는 중…`;
  const bar=document.createElement('div');bar.className='gbar';bar.appendChild(document.createElement('i'));
  b.append(t,bar);syncPresence();
  clearTimeout(serveT);serveT=setTimeout(finishServe,7000);
}
function finishServe(){
  if(!SERVE)return;const {r,who}=SERVE;SERVE=null;
  const st=Math.random()<.6?3:2,tip=st===3?1500:800;
  const d=day();d.cups.push({n:r.n,st,at:hhmm(),guest:who,tip,min:0,auto:1});d.tips+=tip;save();
  guestArrive(who,r.id);lastSig='';
  if(nextGuestAt||S.running)scheduleGuest();
  renderLedger();syncPresence();
  const b=$('sGuest');b.hidden=false;b.className='guestbox done';b.textContent=`${who}님 ${r.n} 서빙 완료! 팁 +${won(tip)}`;
  toast(`${who}님께 ${r.n} 서빙 완료 · 팁 +${won(tip)}`);
  setTimeout(()=>{if(!SERVE&&b.classList.contains('done'))b.hidden=true},6000);
}
function missGuest(){
  scheduleGuest();
  const g=GUESTS[Math.random()*GUESTS.length|0][0];
  const b=$('sGuest');b.hidden=false;b.className='guestbox miss';b.textContent=`자리 비운 사이 ${g}님이 기다리다 그냥 갔어요. 다음 손님은 놓치지 말아요!`;
  toast(`자리 비운 사이 ${g}님이 그냥 갔어요`);
  setTimeout(()=>{if(!SERVE&&b.classList.contains('miss'))b.hidden=true},9000);
}

const estW=(t,fs)=>[...String(t)].reduce((a,ch)=>a+(ch.charCodeAt(0)<128?(ch===' '?.32:.58):1),0)*fs;
function stxt(t,x,y,fs,maxW,o){
  o=o||{};const fit=estW(t,fs)>maxW?` textLength="${maxW}" lengthAdjust="spacingAndGlyphs"`:'';
  return `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle"${fit} fill="${o.fill||'currentColor'}" style="font-family:${o.ff||'var(--body)'}${o.w?';font-weight:'+o.w:''}${o.ls?';letter-spacing:'+o.ls:''}"${o.op?` opacity="${o.op}"`:''}>${sx(t)}</text>`;
}
function wrap2(t,fs,maxW){
  if(estW(t,fs)<=maxW)return[t];
  const w=String(t).split(' ');if(w.length<2){const c=[...t],h=Math.ceil(c.length/2);return[c.slice(0,h).join(''),c.slice(h).join('')]}
  let best=[t],bd=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' '),b=w.slice(i).join(' '),d=Math.max(estW(a,fs),estW(b,fs));if(d<bd){bd=d;best=[a,b]}}
  return best;
}

function jdEl(){return $('jindol')}
function jdSprite(name){$('jdSpr').innerHTML=catSVG(name);$('jindol').dataset.pose=name}
function jdPlace(animate,secs){

  el.style.transition=animate?`left ${secs}s linear, top ${secs}s linear`:'none';
  const p=pct(JDC.x,JDC.y).split(';');el.style.left=p[0].split(':')[1];el.style.top=p[1].split(':')[1];

function jdBubble(t,ms){const b=$('jdBub');b.textContent=t;b.hidden=false;clearTimeout(jdBubble.t);jdBubble.t=setTimeout(()=>{b.hidden=true},ms||3500)}
function jdFloorY(x){const g=gaps();return g.length?g[Math.random()*g.length|0].y:500}
function jdWalkTo(x,y,then,forceSecs){
  const dx=x-JDC.x,dy=y-JDC.y,dist=Math.hypot(dx,dy),secs=Math.max(forceSecs||0,dist/42,.8);  // calm walking pace
  if(Math.abs(dx)>2)JDC.face=dx>0?1:-1;
  JDC.state='walk';JDC.x=x;JDC.y=y;JDC.then=then||null;JDC.until=Date.now()+secs*1000;
  jdSprite('walkA');jdPlace(true,secs);
  clearInterval(JDC.walkT);JDC.frame=0;JDC.walkT=setInterval(()=>{JDC.frame^=1;jdSprite(JDC.frame?'walkB':'walkA')},230);

function jdRest(kind,ms){clearInterval(JDC.walkT);JDC.state=kind;JDC.until=Date.now()+ms;jdSprite(kind==='sleep'?'sleep':'sit');if(kind==='sleep')jdBubble('Zzz…',4000)}
function jdMySpot(){const me=PEOPLE.find(e=>e.isMe&&e.seat!=null&&e.seat>=0);return me?seatSpot(me.seat):null}
function myPeerId(){const p=ROOM&&!roomDead?ROOM.peers().find(x=>x.sameTab):null;return p?p.peer:null}
// beside the chair on the outer side, down on the floor, so faces stay visible
function seatSpot(seat){const tb=TABLES[seat>>1];if(!tb)return null;const side=seat%2;return{x:tb.cx+(side?24:-24)*TS,y:tb.fy+2}}
// the aisles: just below each row of tables (and the open floor under the last row)
// free floor between tables (and at the row ends), level with the chairs, so nobody's face or name is covered
function gaps(){const out=[];const rows=[...new Set(TABLES.map(t=>t.fy))];
  for(const fy of rows){const xs=TABLES.filter(t=>t.fy===fy).map(t=>t.cx).sort((a,b)=>a-b),half=120*TS;
    const edges=[VX+40,...xs.flatMap(x=>[x-half,x+half]),VX+VBW-40];
    for(let i=0;i<edges.length;i+=2){const a=edges[i],b=edges[i+1];if(b-a>70)out.push({x:(a+b)/2,y:fy+2})}}
  const last=Math.max(...rows,500);if(VBH-70>last+80)for(const f of[.2,.5,.8])out.push({x:VX+f*VBW,y:Math.min(VBH-70,last+120)});
  return out}
function aisles(){return gaps().map(g=>g.y)}
function floorSpot(u,v){const g=gaps();if(!g.length)return{x:VX+VBW/2,y:500};return g[Math.min(g.length-1,Math.floor(u*g.length))]}

function catApply(c,first){
  JDC.shared=true;JDC.fav=c.fav||null;
  if(c.say&&c.say.at!==JDC.sayAt){JDC.sayAt=c.say.at;if(!first||Date.now()-0<1e15)jdBubble(String(c.say.t||'').replace('{fav}',favName(c.fav)),4000)}
  if(c.v===JDC.v)return;JDC.v=c.v;
  const at=c.at||{};let seat=at.seat;
  if(seat!=null&&c.fav){const f=PEOPLE.find(e=>!e.isNpc&&(e.peer===c.fav||(e.isMe&&c.fav===myPeerId())));if(f&&f.seat!=null&&f.seat>=0)seat=f.seat}
  const p=seat!=null?seatSpot(seat):floorSpot(at.u??.4,at.v??.5);if(!p)return;
  if(c.mode==='walk'&&!first){jdWalkTo(p.x,p.y,()=>{clearInterval(JDC.walkT);jdSprite('sit')},Math.max(.4,(c.rem||1000)/1000))}
  else{clearInterval(JDC.walkT);JDC.x=p.x;JDC.y=p.y;JDC.state=c.mode==='walk'?'sit':c.mode;JDC.until=Date.now()+(c.rem||0);jdSprite(c.mode==='sleep'?'sleep':'sit');jdPlace(!first,.8)}
}
function jdTick(){
  if(!jdEl()||document.hidden)return;
  const now=Date.now();
  if(JDC.shared){if(JDC.state==='walk'&&now>=JDC.until){const t=JDC.then;JDC.then=null;JDC.state='sit';if(t)t()}return}
  if(JDC.state==='walk'){if(now>=JDC.until){const t=JDC.then;JDC.then=null;if(t)t();else jdRest(Math.random()<.25?'sleep':'sit',4000+Math.random()*9000)}return}
  if(now<JDC.until)return;
  const r=Math.random();
  const spot=jdMySpot();
  if(spot&&(JDC.likesMe>=5?r<.6:CUR==='scrStudy'&&S.running&&r<.35)){jdWalkTo(spot.x,spot.y,()=>{jdRest('sit',12000+Math.random()*10000);jdBubble('옆에서 같이 공부 중',4000)});return}
  if(r<.12){jdRest('sleep',15000+Math.random()*20000);return}
  const g=floorSpot(Math.random(),0);jdWalkTo(g.x,g.y);
}
function jdInit(){
  if(!jdEl())return;
  JDC.x=VX+VBW*.35;JDC.y=jdFloorY(JDC.x);jdSprite('sit');jdPlace(false);JDC.until=Date.now()+3000;
  jdEl().onclick=()=>{
    const h=document.createElement('span');h.className='jd-heart';h.textContent='♥';jdEl().appendChild(h);setTimeout(()=>h.remove(),1200);
    if(act({a:'pet'}))return;
    JDC.likesMe=(JDC.likesMe||0)+1;
    if(JDC.likesMe===5){jdBubble(`${(typeof nick==='string'&&nick)||'나'} 옆이 제일 좋다냥`);const sp=jdMySpot();if(sp)jdWalkTo(sp.x,sp.y,()=>jdRest('sit',20000));return}
    const t=JD_LINES[Math.random()*JD_LINES.length|0];jdBubble(t);
    if(JDC.state==='sleep'){jdRest('sit',5000);jdBubble('…냥? (깼다)')}
  };
  setInterval(jdTick,500);
}

  const hd=document.createElement('b');hd.style.fontSize='12.5px';hd.textContent=`${e.name}님이 한 말 ${lines.length?lines.length+'개':''}`;log.appendChild(hd);
  if(!lines.length){const em=document.createElement('span');em.className='empty';em.textContent='아직 말풍선을 띄운 적이 없어요.';log.appendChild(em)}
  for(const c of lines){const ln=document.createElement('div');ln.className='ln';const tm=document.createElement('time');const d=new Date(c.at);
    tm.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const sp=document.createElement('span');sp.textContent=c.t;ln.append(tm,sp);log.appendChild(ln)}
  setTimeout(()=>{log.scrollTop=log.scrollHeight},0);
  mk(MUTED.has(e.peer)?'알림음 다시 켜기':'이 사람 알림음 끄기','',()=>{if(MUTED.has(e.peer))MUTED.delete(e.peer);else MUTED.add(e.peer);saveMute();
    toast(MUTED.has(e.peer)?`${e.name}님 말풍선 알림음을 껐어요.`:`${e.name}님 말풍선 알림음을 다시 켰어요.`);showSel()});
  box.appendChild(log);
  mk('옆자리 앉기','sit',()=>{const p=ROOM&&ROOM.peers().find(x=>x.peer===e.peer);
    if(!p||(p.presence||{}).st!=='study'||!(remOf(p)>30)){toast(`${e.name}님이 공부 중일 때 옆자리에 앉을 수 있어요.`);return}
    const idx=e.seat,nb=idx%2?idx-1:idx+1;if(!PEOPLE.some(x=>!x.isMe&&x.seat===nb)){mySeat=nb;try{localStorage.setItem('barista.seat',String(nb))}catch(_){}}
    sitWith(p,e.name)});
}
function say(t){
  t=(t||'').trim().slice(0,20);if(!t)return;
  mySay={t,at:Date.now()};$('sayIn').value='';syncPresence();
  if(!CHAT_SHARED)addChat({id:myPeerId()||'~me',name:nick||'나',t,at:Date.now()});
  setTimeout(()=>renderFriends(),SAY_MS+100);
}
function setPick(on){$('hall').classList.toggle('pick',on);$('pickSeat').setAttribute('aria-pressed',String(on));$('pickSeat').textContent=on?'앉을 자리를 눌러요':'자리 옮기기'}
$('pickSeat').onclick=()=>setPick(!$('hall').classList.contains('pick'));
$('sayGo').onclick=()=>say($('sayIn').value);
$('sayIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();say($('sayIn').value)}});
['화이팅!','졸려…','리필 각','5분만 쉬자','집중 모드'].forEach(t=>{const b=document.createElement('button');b.className='mini';b.textContent=t;b.onclick=()=>say(t);$('quick').appendChild(b)});
function sitWith(p,nm){
  const pr=p.presence||{},r=byId(pr.d),s=remOf(p);if(!r||!s)return;
  if(CUR==='scrStudy'&&S.running){toast('지금 내 타이머가 돌아가는 중이에요. 자리 정리 후 앉아주세요.');return}
  if(!MADE||CUR!=='scrDone'){const i=ideal(r);MADE={r,kind:i.kind,L:i.L,ice:i.ice,st:3,idx:-1,left:1};saveCup()}
  openStudy({dur:pr.dur,rem:s});sendCheer(p.peer,'sit');syncPresence();
  toast(`${nm}님 옆자리에 앉았어요. ${mmss(s)} 같이 집중!`);
}
setInterval(()=>{if(!document.hidden)renderFriends()},1000);
(async()=>{
  const cl=window.claude;
  if(!cl||!cl.use){renderFriends();return}
  try{USER=await cl.use('user')}catch(e){}
  try{ROOM=await cl.use('room')}catch(e){}
  if(!ROOM){renderFriends();return}
  ROOM.onPeers(ch=>{handleCheers([...ch.joined,...ch.updated]);renderFriends()},()=>{roomDead=true;renderFriends()});
  if(ROOM.onWorld)ROOM.onWorld(applyWorld);
  if(ROOM.onChat)ROOM.onChat(m=>{CHAT_SHARED=true;if(m.t==='chatlog'){CHAT=(m.list||[]).slice();if(selKey)showSel();renderChatPanel()}else if(m.e)addChat(m.e)});
  syncPresence();
})();

renderMenu();renderFriends();
const TWO=()=>matchMedia('(min-width:820px)').matches;
function layoutHall(w,h){
  // pick the fewest rows that fit all tables, so the room is as large as the box allows
  const NT=SEATS/2;let best=null;
  for(let rows=1;rows<=6;rows++){
    const vbh0=600+220*(rows-1)+(TWO()?54:0),vbw=Math.max(1000,w&&h?vbh0*w/h:1000),vbh=Math.max(vbh0,vbw*(h/w||0)),n=Math.floor((vbw-60)/(230*TS));
    if(n*rows>=NT){best={rows,vbw,vbh,n};break}
  }
  VBW=best.vbw;VBH=best.vbh;VX=-(VBW-1000)/2;
  TABLES=[];let left=NT;
  for(let r=0;r<best.rows;r++){const k=Math.min(best.n,Math.ceil(left/(best.rows-r))),sp=VBW/best.n,x0=VX+(VBW-sp*k)/2;
    for(let j=0;j<k;j++)TABLES.push({cx:x0+sp*(j+.5),fy:520+220*r,k:(j+r)%2});left-=k}
}
function fitHall(){
  const bx=$('hallScroll'),hall=$('hall');
  if(matchMedia('(min-width:820px)').matches){const w=bx.clientWidth,h=bx.clientHeight;if(!w||!h)return;
    hall.style.width=w+'px';hall.style.height=h+'px';hall.style.aspectRatio='';layoutHall(w,h)}
  else{hall.style.width='';hall.style.height='';layoutHall(0,0);hall.style.aspectRatio=`1000/${VBH}`}
  $('hallSvg').setAttribute('viewBox',`${VX.toFixed(1)} 0 ${VBW.toFixed(1)} ${VBH.toFixed(1)}`);
  $('wallBoard').style.cssText=box(324,130,198,102);
  $('machine').style.cssText=box(866,220,106,58);
  $('adWall').style.cssText=box(36,128,200,172);
  $('adPost').style.cssText=box(542,128,78,136);
  $('adPop').style.cssText=box(644,234,40,42);
  lastSig='';renderFriends();
  if(typeof jdPlace==='function'){JDC.x=Math.min(Math.max(JDC.x,VX+40),VX+VBW-40);JDC.y=Math.min(JDC.y,VBH-60);jdPlace(false)}
}
try{new ResizeObserver(fitHall).observe($('hallScroll'))}catch(e){}
addEventListener('resize',fitHall);fitHall();jdInit();
// pick up a study session that was running before an update or refresh
(function(){try{
  const v=JSON.parse(localStorage.getItem('barista.study')||'null');if(!v)return;
  const r=byId(v.cup);if(!r||!v.dur)return;
  const el=v.el+(v.run?(Date.now()-v.at)/1000:0);
  if(Date.now()-v.at>6*3600*1000){localStorage.removeItem('barista.study');return}
  const i=ideal(r);MADE={r,kind:i.kind,L:i.L,ice:i.ice,st:3,idx:Number.isInteger(v.idx)?v.idx:-1,left:1};
  openStudy();S.dur=v.dur;S.elapsed=Math.min(el,v.dur*60);
  if(v.run){S.start=Date.now();S.running=true;clearInterval(sT);sT=setInterval(renderStudy,500);scheduleGuest(true)}
  renderChips();renderStudy();syncPresence();
  if(!S.done)toast(v.run?'하던 공부 이어서 진행 중이에요.':'멈춰둔 공부가 그대로 있어요.');
}catch(e){}})();
</script>
